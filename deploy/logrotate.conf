# Log rotation for Ava's append-only ledgers.
#
# ava_bridge/audit.py deliberately never deletes audit history — "rotation is the
# operator's business (logrotate)". That was a defensible decision documented in
# exactly one docstring, with no config shipped anywhere, so in practice nothing
# rotated and no operator knew they were meant to arrange it. This file is that
# missing half.
#
# Sizing, measured on a daily-use install: audit.jsonl grows ~3.7 MB/year, so
# yearly rotation with 5 kept generations is roughly two decades of history in
# ~20 MB. Rotation here is about bounding a single file, not reclaiming space.
#
# performance.jsonl is NOT listed: perf_log.py rotates it itself
# (AVA_PERF_LOG_MAX_BYTES / AVA_PERF_LOG_KEEP) and perf_store rolls segments up
# before they age out. Two rotators on one file would fight.
#
# Install (adjust the path to your AVA_HOME):
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/ava
#   sudo sed -i 's#/opt/ava#/your/AVA_HOME#' /etc/logrotate.d/ava
#   sudo logrotate --debug /etc/logrotate.d/ava     # dry run
#
# `create` (not `copytruncate`) is correct: audit.py opens the file per write
# with O_APPEND rather than holding a descriptor, so it picks up the new inode on
# the next record with no lost lines.

/opt/ava/logs/audit.jsonl {
    yearly
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    create 0600 root root
}
