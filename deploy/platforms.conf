linux-gpu              | linux-gpu      | unknown  | Linux, GPU present but unidentifiable          | cpu        | ollama | none          | -   | ci-simulated       | -
linux-cpu              | linux-cpu      | system   | CPU-only Linux                                 | cpu        | ollama | rapl-x86      | -   | ci-native          | ci.yml:test
