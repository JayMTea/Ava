# Platform support matrix — the single source of truth.
#
# This file exists because the same knowledge lived in two hand-maintained tables
# that could not both be right: the "Verified on device" column in
# deploy/README.md (an INSTALL-path table) and the support matrix in
# docs/HWINFO_VALIDATION.md (a WHAT-CAN-HWINFO-READ table). They already
# disagreed about Apple Silicon. Both now render from this file, `ava doctor` and
# deploy/install.sh print the detected row, and tests/test_platform_matrix_ssot.py
# fails the build if a platform class exists in code with no row here — or if a
# row claims a verification tier it has no evidence for.
#
# The `tier` column is the point of the whole file. A breadth claim nobody can
# check is the same defect as a wrong number, so every row states how strongly it
# is known, and anything above ci-simulated must name a file that exists.
#
# FORMAT — pipe-separated, first match wins, order significant:
#
#   key | platform_id | mem_model | label | profile | engine | power_source | nominal_w | tier | evidence
#
#   key           unique slug. NOT the same as platform_id: hwinfo cannot tell a
#                 GB10 from an RTX box (both are `linux-nvidia`) but their
#                 fit-memory behaviour and their evidence differ, so they are two
#                 rows keyed by mem_model.
#   platform_id   what ava_bridge.hwinfo.platform_id() returns. May repeat.
#   mem_model     unified | discrete | system | unknown — what fit_memory() gates
#                 on. `system` = no accelerator, so the system pool IS the answer.
#   profile       deploy/profiles/<name>.env to select, or `bare-metal`.
#   engine        the local engine this platform can actually serve (not a wish).
#   power_source  where GPU/CPU watts come from, or `none`. Consumed by the energy
#                 dashboard; `none` means energy is a labelled estimate.
#   nominal_w     fallback wattage when power_source yields nothing. `-` = no
#                 defensible number, so report NOT MEASURED rather than guess.
#                 NOTE: not yet wired into perf_store/dashboard — that is the
#                 phase that kills the global 180 W constant. Values here are
#                 documented order-of-magnitude figures, not measurements.
#   tier          verified-on-device | ci-native | ci-simulated |
#                 community-reported | unsupported   (see below)
#   evidence      path or job that backs the tier. `-` only for ci-simulated and
#                 below; the guard enforces that.
#
# TIERS, strongest first:
#   verified-on-device  a human ran tools/ondevice_check.py on real hardware and
#                       committed its JSON report. `evidence` names that file.
#   ci-native           a CI job runs the real code on real hardware of this
#                       class. `evidence` names workflow:job.
#   ci-simulated        decision logic exercised against constructed or recorded
#                       sysfs bytes. The PARSING is tested; the NUMBERS are not.
#   community-reported  someone else's ondevice_check report. `evidence` names it.
#   unsupported         detected and refused, with an explanation.
#
# key | platform_id | mem_model | label | profile | engine | power_source | nominal_w | tier | evidence
linux-nvidia-unified   | linux-nvidia   | unified  | Unified-memory NVIDIA (GB10 / Grace-Blackwell) | gpu        | vllm   | nvml-or-smi   | 180 | verified-on-device | docs/evidence/linux-nvidia-unified-2026-07-29.json
linux-nvidia-discrete  | linux-nvidia   | discrete | Linux + discrete NVIDIA (RTX / data-centre)    | gpu        | vllm   | nvml-or-smi   | 180 | ci-simulated       | -
linux-amd-unified      | linux-amd      | unified  | AMD APU (Strix Halo / Ryzen AI Max)            | rocm       | ollama | amd-hwmon     | 90  | ci-simulated       | -
linux-amd-discrete     | linux-amd      | discrete | AMD discrete (Radeon / ROCm)                   | rocm       | ollama | amd-hwmon     | 250 | ci-simulated       | -
