# Optional exporter. The operator supplies a compatible image and configuration.
# Include explicitly with -f; no exporter is started by the standard profiles.
services:
  ava-shipper:
    image: ${AVA_EXPORTER_IMAGE:?set an exporter image pinned by digest}
    restart: unless-stopped
    user: ${AVA_EXPORTER_USER:-1000:1000}
    env_file:
      - ${AVA_EXPORTER_ENV:?set a dedicated exporter credentials file}
    volumes:
      - ${AVA_HOME:?set the instance state directory}:/src:ro
      - ${AVA_EXPORTER_STATE:?set the exporter state directory}:/state
      - ${AVA_EXPORTER_CONFIG:?set the exporter configuration path}:/etc/shipper/shipper.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
