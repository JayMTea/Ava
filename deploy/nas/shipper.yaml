# Example configuration for a datastack-shipper-compatible exporter.
# Copy outside the checkout, configure your endpoints and authorize each stream.
# This is not read by Ava. Supply your own compatible exporter image.
bucket: assistant-export
source_name: assistant-instance
s3:
  endpoint: https://objects.example.org
  access_key_env: EXPORT_S3_ACCESS_KEY
  secret_key_env: EXPORT_S3_SECRET_KEY
  verify_tls: true
clickhouse:
  host: warehouse.example.org
  port: 8443
  secure: true
  verify_tls: true
  user: assistant_ingestor
  password_env: EXPORT_WAREHOUSE_PASSWORD
state_dir: /state
nightly_at: "02:15"
streams: []
