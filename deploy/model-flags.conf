# Per-model vLLM flags — the single source of truth.
#
# Two flags MUST match the model: --tool-call-parser and --reasoning-parser.
# Getting them wrong does not raise an error. vLLM returns NO tool_calls, the
# call falls through as plain text, the agent never sees it, and turns loop until
# they time out — it looks like Ava "not responding". So they are resolved from
# this table rather than inherited from whatever the last model used.
#
# This file exists because the same knowledge used to live in two places: an
# inline `case` in deploy/local-serve.sh and a hardcoded `${AVA_TOOL_PARSER:-hermes}`
# in deploy/docker-compose.yml, which could express no reasoning parser at all.
# They had already drifted. Both now read this file via deploy/resolve-model-flags.sh,
# and tests/test_model_flags_ssot.py fails the build if a parser name reappears
# anywhere else in the tree.
#
# FORMAT — pipe-separated, first match wins, order is significant:
#
#   glob | family | tool_parser | reasoning_parser | native_ctx | extra_flags
#
#   glob         matched against the LOWERCASED model id
#   family       label, for log lines and diagnostics only
#   tool_parser  vLLM --tool-call-parser value       ("-" = pass no flag)
#   reasoning_parser  vLLM --reasoning-parser value  ("-" = pass no flag)
#   native_ctx   the model's real max_position_embeddings, or "-" if unknown.
#                Used to CLAMP --max-model-len. "-" means "do not clamp" and
#                preserves whatever the caller asked for.
#   extra_flags  anything else the model needs to boot or behave ("-" = none)
#
# ORDER MATTERS. Specific globs must precede the general ones they overlap:
# *nemotron*omni* before *nemotron*, *qwen3-coder* before *qwen3* before *qwen*.
# tests/test_model_flags_ssot.py enforces that ordering mechanically.
#
# native_ctx is deliberately sparse. A WRONG value silently caps a model's
# context, which is worse than not clamping at all — so it is filled in only
# where the figure is certain, and left "-" otherwise. The one that matters is
# the shipped default (Qwen2.5, 32768): compose used to request 65536 against it,
# and vLLM's _get_and_verify_max_len RAISES on that rather than clamping, so
# `--profile gpu` could not boot on any machine.
#
# Parser names come from each model card's vLLM section. If vLLM rejects one,
# check the card — do not just drop the flag, because dropping it silently
# disables tool calling instead of failing loudly.

# --- NVIDIA Nemotron ---------------------------------------------------------
# Omni emits tool calls in the qwen3_coder XML format (<function=name>
# <parameter=x>…), NOT hermes JSON — `hermes` here returns no tool_calls at all.
# --enforce-eager: this model captures CUDA graphs across 512 batch sizes
#   INCLUDING its vision encoder; that transient spike OOM-killed the engine on a
#   121 GB unified pool. Disabling capture costs ~5-10% decode speed and is what
#   makes an always-on load fit.
# --max-num-batched-tokens 4096: NemotronH's Mamba cache alignment requires this
#   to be >= block_size (2128); the 2048 default trips an assert at boot.
*nemotron*omni*        | nemotron-omni | qwen3_coder     | nemotron_v3   | 65536 | --enforce-eager --max-num-batched-tokens 4096
*nemotron*             | nemotron      | hermes          | nemotron_v3   | -     | -

# --- Qwen --------------------------------------------------------------------
*qwen3-coder*          | qwen3-coder   | qwen3_coder     | -             | -     | -
*qwen3_coder*          | qwen3-coder   | qwen3_coder     | -             | -     | -
*qwen3*                | qwen3         | hermes          | qwen3         | 32768 | -
*qwen2*                | qwen          | hermes          | -             | 32768 | -
*qwen*                 | qwen          | hermes          | -             | 32768 | -

# --- DeepSeek ----------------------------------------------------------------
*deepseek*r1*          | deepseek-r1   | deepseek_v3     | deepseek_r1   | -     | -
*deepseek*             | deepseek      | deepseek_v3     | -             | -     | -

# --- Meta Llama --------------------------------------------------------------
*llama-4*              | llama4        | llama4_pythonic | -             | -     | -
*llama4*               | llama4        | llama4_pythonic | -             | -     | -
*llama-3*              | llama3        | llama3_json     | -             | -     | -
*llama3*               | llama3        | llama3_json     | -             | -     | -

# --- Mistral -----------------------------------------------------------------
*mistral*              | mistral       | mistral         | -             | -     | -
*magistral*            | mistral       | mistral         | -             | -     | -
*devstral*             | mistral       | mistral         | -             | -     | -

# --- Others ------------------------------------------------------------------
*gpt-oss*              | gpt-oss       | openai          | openai_gptoss | -     | -
*gpt_oss*              | gpt-oss       | openai          | openai_gptoss | -     | -
*glm-4*                | glm4          | glm45           | glm45         | -     | -
*glm4*                 | glm4          | glm45           | glm45         | -     | -
*hermes*               | hermes        | hermes          | -             | -     | -
