# Ava — self-hosted, plug-and-play. Pick the profile that matches your hardware,
# copy it to .env, and start:
#
#   cd deploy
#   cp profiles/gpu.env .env      # or cpu / cuda / rocm / cloud / full / agent
#   docker compose up -d
#
# Or let deploy/install.sh detect your hardware and write .env for you.
#
# The profile lives IN .env (as COMPOSE_PROFILES), not on the command line, so
# every later `logs` / `down` / `pull` / `exec` sees the same environment that
# `up` did. Passing `--profile` per invocation instead means a `down` typed
# without it interpolates different values and may not find its own services.
#
# All state lives in one folder (AVA_HOME, default ./ava-data). On first visit
# the web UI walks you through setting an admin password (no secret to hunt for).
#
# Inference: chat flows bridge -> EMBEDDED router (in-process, :8010 inside the
# ava container) -> the profile's engine — the same product as bare metal, with
# failover + perf logging + the /which model pill. Which engine, and which model,
# comes from the AVA_BACKEND_* trio in deploy/profiles/<profile>.env. The bridge
# refuses to start rather than guess them: it runs under every profile, so any
# single default is wrong for most of them.
# The full tool-using agent (self-coding, connectors) needs the OpenClaw runtime,
# which is not bundled in this image — see deploy/README.md. (A future agent
# container only needs network access to ava:8010 + the router token.)
name: ava

services:
  ava:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        AVA_VERSION: ${AVA_VERSION:-}
        AVA_REVISION: ${AVA_REVISION:-}
    # Local build tag by default. To run the SIGNED published image instead:
    #   AVA_IMAGE=ghcr.io/jaymtea/ava-bridge:v0.1.0  (then `docker compose pull`)
    # Verify it first — see deploy/README.md "Verified install".
    image: ${AVA_IMAGE:-ava/bridge:latest}
    environment:
      AVA_HOME: /data
      AVA_PORT: "8096"
      # Bind all interfaces INSIDE the container namespace. The `ports:` entry
      # below is what keeps this host-local — it publishes on 127.0.0.1 only.
      # Binding loopback in here instead leaves the published port with nothing
      # behind it while the container's own healthcheck (which curls that same
      # in-namespace loopback) still reports healthy. deploy/Dockerfile carries
      # the same value; this restates it so the contract is visible where the
      # port mapping is. tests/test_dockerfile_bind.py enforces both.
      AVA_HOST: ${AVA_HOST:-0.0.0.0}
      AVA_PASSWORD: ${AVA_PASSWORD:-}
      # Agent runtime: "direct" (tool-less, default) or "remote" (full agent via
      # the `agent` service below — enable the `agent` profile + set these).
      AVA_AGENT_ENABLED: ${AVA_AGENT_ENABLED:-0}
      AVA_AGENT_RUNTIME: ${AVA_AGENT_RUNTIME:-direct}
      AVA_AGENT_URL: http://agent:9100
      # Bind the embedded router on all interfaces so the agent sandbox can reach
      # it at ava:8010 (this turns /v1 auth ON; the agent presents the token).
      AVA_ROUTER_HOST: ${AVA_ROUTER_HOST:-127.0.0.1}
      # The OpenAI-compatible backend behind the embedded router.
      #
      # These have NO default on purpose. This service starts under every
      # profile, so any single default is wrong for most of them: the previous
      # global `http://vllm:8002/v1` pointed `--profile cpu` at a hostname that
      # profile never starts, and the bridge then failed every turn against a
      # DNS name that would never resolve — after a multi-GB pull, with nothing
      # saying why. `:?` turns that into an instruction at second zero.
      #
      # deploy/profiles/*.env carries the right trio for each profile.
      AVA_BACKEND_URL: ${AVA_BACKEND_URL:?no backend configured — run deploy/install.sh, or `cd deploy && cp profiles/<cpu|cuda|gpu|rocm|cloud|full|agent>.env .env && docker compose up -d`. For the cloud profile, fill in the empty values in .env.}
      AVA_BACKEND_ENGINE: ${AVA_BACKEND_ENGINE:?set with AVA_BACKEND_URL — see deploy/profiles/}
      # The router sends this string verbatim as the OpenAI `model` field, so it
      # must be what the engine was STARTED with; a mismatch is a 404 per turn.
      AVA_BACKEND_MODEL: ${AVA_MODEL:?set with AVA_BACKEND_URL — see deploy/profiles/}
      AVA_INFERENCE_KEY: ${AVA_INFERENCE_KEY:-}
      # the GPU service endpoint for the image pipeline + gpu-service connector (`full`
      # profile only — in other profiles the connector row just shows down).
      AVA_GPU_SERVICE: ${AVA_GPU_SERVICE:-http://gpu-service:8188}
      # The host's GPU, MEASURED by deploy/install.sh and DECLARED to the bridge.
      #
      # This service is never given a GPU (compose reserves devices for the
      # inference services only), so nothing inside this container can discover
      # the card the machine actually has — that is why Setup → Hardware reports
      # no GPU under Docker even on an NVIDIA box. install.sh is the one process
      # that stands on the host and reads it, and it used to print the number and
      # let it die as a shell local. A declared host fact is the ONLY way the
      # truth crosses this boundary.
      #
      # `declared`, not `detected`, in the name on purpose: the container did not
      # measure this and cannot re-check it, so a consumer must present it as the
      # installer's claim about the host, never as its own reading. Empty means
      # "nobody declared one" — never "there is no GPU".
      AVA_DECLARED_HOST_GPU_NAME: ${AVA_DECLARED_HOST_GPU_NAME:-}
      AVA_DECLARED_HOST_GPU_VRAM_MIB: ${AVA_DECLARED_HOST_GPU_VRAM_MIB:-}
    volumes:
      - ${AVA_HOME:-./ava-data}:/data
    ports:
      - "127.0.0.1:8096:8096"
    restart: unless-stopped

  # --- full tool-using agent (opt-in; profile `agent`) -------------------------
  # Runs NemoClaw + the RemoteRuntime shim. It mounts the host Docker socket so
  # OpenShell can spawn the agent sandbox — that socket is ROOT-EQUIVALENT on the
  # host, so this is deliberately opt-in. Enable with:
  #   cp profiles/agent.env .env && docker compose up -d   (or profiles/full.env)
  # That file sets AVA_AGENT_ENABLED / AVA_AGENT_RUNTIME / AVA_ROUTER_HOST,
  # which only work as a set — enabling one alone leaves the bridge tool-less.
  # See deploy/README.md "Full agent in Docker" for the security caveat + the
  # sandbox<->bridge networking notes.
  agent:
    profiles: ["agent", "full"]
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    image: ava/agent-runtime:latest
    environment:
      AVA_HOME: /data
      AVA_ROUTER_URL: http://ava:8010
      AVA_BRIDGE_URL: http://ava:8096
      AVA_OC_SANDBOX: ${AVA_OC_SANDBOX:-my-assistant}
      AVA_OC_AGENT: ${AVA_OC_AGENT:-main}
      # Same value the bridge uses. No `:?` here: `docker compose config`
      # interpolates EVERY service regardless of profile, so a guard on this one
      # reports a missing model against `agent` even when the user is on the
      # cloud profile and has no agent. The `ava` service above always runs and
      # already enforces it, with a message naming the thing they configured.
      AVA_BACKEND_MODEL: ${AVA_MODEL}
      # Override if the sandbox can't auto-resolve the bridge container's IP.
      AVA_BRIDGE_IP: ${AVA_BRIDGE_IP:-}
    volumes:
      - ${AVA_HOME:-./ava-data}:/data
      # Root-equivalent on the host — see the security caveat in the docs.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist the whole home: the entrypoint installs the NemoClaw CLI here on
      # first start, plus the sandbox registry/onboard state — so restarts skip
      # both the install and the re-onboard.
      - ava-agent-home:/root
    depends_on:
      - ava
    restart: unless-stopped

  # --- inference: CPU / no-GPU users ---
  # profiles/cpu.env already wires the bridge to this service. The model store
  # starts EMPTY, so first run needs one pull (deploy/install.sh does it):
  #   docker compose exec ollama ollama pull llama3.2
  #
  # NO `devices:` and NO `deploy.resources.reservations` here, ever. This is the
  # service every GPU-less machine depends on, and a reservation it cannot
  # satisfy makes compose refuse to start it — see `ollama-cuda` below, which is
  # the accelerated variant precisely so this one stays startable anywhere.
  ollama:
    profiles: ["cpu"]
    image: ollama/ollama:latest
    volumes:
      - ${AVA_HOME:-./ava-data}/models/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  # --- inference: AMD GPU users (ROCm) ---
  # A SEPARATE service from `ollama`, not a variant of it, for two reasons that
  # both break a single merged service:
  #   * different image tag (`:rocm` carries the ROCm runtime, ~4 GB more), and
  #   * `/dev/kfd` does not exist on a non-AMD host, so a service declaring it
  #     fails to start everywhere else — including on the cpu profile.
  # Compose profiles keep them mutually exclusive, and the model cache is shared
  # so switching profiles does not re-download weights.
  #
  # `group_add: render, video` is required, not decorative: /dev/kfd is owned by
  # the render group, and without it the container sees the device node and is
  # refused by permissions — which surfaces as "no GPU detected" rather than as a
  # permissions error.
  #
  # ⚠️ NOT VERIFIED ON DEVICE — see deploy/profiles/rocm.env.
  ollama-rocm:
    profiles: ["rocm"]
    image: ollama/ollama:rocm
    volumes:
      - ${AVA_HOME:-./ava-data}/models/ollama:/root/.ollama
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  # --- inference: NVIDIA GPU users, quantized (profile `cuda`) ---
  # Ollama with CUDA, for a card that is worth using but cannot hold vLLM's FP16
  # weights plus a 32k KV cache — the `vllm` service below needs ~18 GB for the
  # default 7B, while a Q4_K_M 3B is ~2 GB of weights and runs entirely on a
  # 6 GB laptop card. Without this service such a card had nowhere to go but the
  # cpu profile, several times slower for the same answer.
  #
  # A SEPARATE service from `ollama`, not a `deploy.resources` block bolted onto
  # it, for the reason the `gpu-service` comment below states: "Docker never grants
  # GPU access implicitly — an image cannot opt itself in, because that is a
  # daemon-level decision." The reservation therefore has to be DECLARED, and a
  # service that declares it cannot start on a host with no NVIDIA runtime. That
  # is the same trap `ollama-rocm` documents ("/dev/kfd does not exist on a
  # non-AMD host, so a service declaring it fails to start everywhere else —
  # including on the cpu profile"), and `ollama` is the one service the
  # GPU-less majority depends on. Compose profiles keep the three mutually
  # exclusive.
  #
  # Unlike ROCm this needs no special image: the CUDA runtime ships in the
  # default `ollama/ollama` tag, so `cpu` and `cuda` pull the same image and
  # share the same model cache — switching between them re-downloads nothing.
  ollama-cuda:
    profiles: ["cuda"]
    image: ollama/ollama:latest
    volumes:
      - ${AVA_HOME:-./ava-data}/models/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    restart: unless-stopped

  # --- inference: NVIDIA GPU users, FP16 (profile `gpu`) ---
  # The default brain here is deliberately SMALL (~16 GB VRAM at the default
  # utilization) so that `--profile gpu` starts on an ordinary GPU. This is the
  # first command README.md tells a new user to run; it previously defaulted to a
  # 30B model needing ~35 GB of weights, which no consumer card can hold, and the
  # uncapped restart policy below then retried that impossible start forever.
  #
  # Scaling UP is the deliberate act, not scaling down. On a big-memory box, set
  # AVA_MODEL and re-run deploy/install.sh — it resolves the model's parsers and
  # context from deploy/model-flags.conf and writes them into deploy/.env. You no
  # longer pick a parser by hand, and a reasoning model's --reasoning-parser is
  # no longer untemplatable: see the `command:` note below.
  #
  # Memory flags are NOT optional on a shared box. Without them vLLM takes ~90% of
  # the pool and captures CUDA graphs, which on unified-memory hardware (Grace-class,
  # Apple) leaves nothing for the image engine the `full` profile starts alongside it —
  # and an uncapped `restart` policy then retries the impossible start forever. That
  # combination cost 7,997 restarts on the development box. Every value is
  # env-overridable; see deploy/local-serve.sh for the measured reasoning.
  vllm:
    profiles: ["gpu", "full"]
    image: vllm/vllm-openai:latest
    # Per-model flags come from ONE place: deploy/model-flags.conf, resolved by
    # deploy/resolve-model-flags.sh. This used to be a hardcoded
    # `--tool-call-parser ${AVA_TOOL_PARSER:-hermes}` here AND a per-family `case`
    # in deploy/local-serve.sh — two copies of the same knowledge, already drifted,
    # and the compose one could not express --reasoning-parser at all.
    #
    # String form (not a YAML list) on purpose: compose shlex-splits it AFTER
    # interpolation, so one variable can expand into several flags. That is what
    # makes "vLLM rejects a bare --reasoning-parser" a non-problem — the flag is
    # either present with a value or absent from the string entirely.
    #
    # The two defaults below are the resolved values for the SHIPPED default model
    # (deploy/default-model.env), so `docker compose up` works with no .env at all.
    # tests/test_model_flags_ssot.py asserts they still equal what the resolver
    # produces, so they cannot drift from the table.
    command: >-
      --model ${AVA_MODEL:?set with AVA_BACKEND_URL — see deploy/profiles/}
      --trust-remote-code
      --port 8002
      --gpu-memory-utilization ${AVA_VLLM_GPU_UTIL:-0.90}
      --enforce-eager
      --max-model-len ${AVA_VLLM_MAX_LEN:-32768}
      ${AVA_VLLM_MODEL_FLAGS:---enable-auto-tool-choice --tool-call-parser hermes}
    volumes:
      - ${AVA_HOME:-./ava-data}/models/hf:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    # `on-failure` WITH a cap, not `unless-stopped`: a start that cannot fit must not be
    # retried forever. Ava's allocator (ava.yaml `alloc.models`) is the component that
    # decides when there is room; a supervisor with no memory awareness and no cap will
    # fight it. See `ava alloc status`.
    # The cap is the point — this said `on-failure` with no count while the comment
    # claimed otherwise, so an under-provisioned GPU restart-looped silently.
    restart: on-failure:3

  # --- image / video generation (optional) ---
  # Uses the upstream the GPU service image; mount your checkpoints under
  # $AVA_HOME/models/gpusvc. Enable the `gpu-service` connector in ava.yaml to wire it.
  # MEASURED 2026-07-29: this service had no `devices`, no `runtime` and no
  # `deploy.resources.reservations`, and Docker never grants GPU access
  # implicitly — an image cannot opt itself in, because that is a daemon-level
  # decision. So GPU workloads under the `full` profile was **CPU-only on
  # every platform**, while `profiles/full.env` throttled vLLM to
  # AVA_VLLM_GPU_UTIL=0.55 to "leave room for the GPU model-class image work" that could
  # never use it. Two defects reinforcing each other: renders were slow for a
  # reason nobody could see, and the brain gave up 45% of the pool for nothing.
  #
  # The reservation below is the same block vllm carries. It is NVIDIA-specific
  # (`driver: nvidia`), which is correct for now — there is no AMD equivalent of
  # this profile yet, and `rocm` runs Ollama with no image engine.
  gpu-service:
    profiles: ["full"]
    image: ${AVA_GPU_SERVICEUI_IMAGE:-ghcr.io/ai-dock/gpu-service:latest}
    ports:
      - "127.0.0.1:8189:8188"
    volumes:
      - ${AVA_HOME:-./ava-data}/models/gpusvc:/opt/the GPU service/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    restart: unless-stopped
# The `cloud` profile starts only the ava service; set in .env:
#   AVA_BACKEND_URL=https://api.openai.com/v1  (or your provider's /v1 base)
#   AVA_BACKEND_ENGINE=openai  AVA_MODEL=<model id>  AVA_INFERENCE_KEY=<key>

volumes:
  ava-agent-home:   # NemoClaw CLI + sandbox registry/state for the agent runtime
