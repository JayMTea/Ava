name: Release

# Cut a release by pushing a SemVer tag:  git tag -s v0.1.0 && git push origin v0.1.0
# (see docs/RELEASING.md). Builds a multi-arch image, pushes it to GHCR, signs it
# keylessly with cosign (GitHub OIDC — no keys to manage), attaches an SBOM +
# checksums, and creates the GitHub Release from the matching CHANGELOG section.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release, read the signed tag
  packages: write   # push the image to ghcr.io
  id-token: write   # cosign keyless signing via the GitHub OIDC provider

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Container references must be lowercase; the owner may be mixed-case
      # (e.g. JayMTea). Resolve it once and reuse it as $IMAGE / ${{ env.IMAGE }}.
      - name: Resolve lowercase image name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/ava-bridge" >> "$GITHUB_ENV"
          echo "IMAGE_AGENT=ghcr.io/${owner}/ava-agent-runtime" >> "$GITHUB_ENV"

      - name: Check the tag is signed (informational)
        run: |
          if git verify-tag "${GITHUB_REF_NAME}" 2>/dev/null; then
            echo "tag ${GITHUB_REF_NAME} signature: OK"
          else
            echo "::warning::tag ${GITHUB_REF_NAME} is not verifiably signed. Recommended: git tag -s (the maintainer's public key must be importable to verify here)."
          fi

      - name: Resolve version (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push (multi-arch, SBOM + SLSA provenance)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AVA_VERSION=${{ steps.ver.outputs.version }}
            AVA_REVISION=${{ github.sha }}
          provenance: true
          sbom: true

      # The `agent` and `full` profiles need this image, and until now no
      # automation had ever built it, let alone published one — so anyone opting
      # into the tool-using agent had to build it locally from a Dockerfile that
      # nothing verified. Same platforms, provenance and SBOM as the bridge.
      - name: Agent runtime image tags + labels
        id: meta_agent
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_AGENT }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push the agent runtime (multi-arch, SBOM + SLSA provenance)
        id: build_agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_agent.outputs.tags }}
          labels: ${{ steps.meta_agent.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the images (keyless / OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_AGENT: ${{ steps.build_agent.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE_AGENT}@${DIGEST_AGENT}"

      - name: Source SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ava-sbom.cyclonedx.json

      - name: Release notes from CHANGELOG
        run: python3 deploy/scripts/changelog_extract.py "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Checksums
        run: sha256sum ava-sbom.cyclonedx.json > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            ava-sbom.cyclonedx.json
            checksums.txt
          fail_on_unmatched_files: true
