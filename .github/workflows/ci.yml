name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Install from the pin file, not a second literal. Two pins for one tool
      # (this said 0.15.14 while requirements-dev.txt said 0.15.20) is a
      # guaranteed CI-green / local-red divergence.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  dco:
    # CONTRIBUTING states the sign-off as an absolute requirement and nothing
    # checked it, so it was advisory in practice — 3 of the last 50 commits carry
    # one. Scoped to the commits the PR ADDS: enforcing it over history would fail
    # every PR for commits the author did not write, which is how a check gets
    # switched off. Push events are skipped for the same reason.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit in this PR is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qi "^Signed-off-by: "; then
              echo "::error::$(git show -s --format='%h %s' "$sha") — no Signed-off-by"
              missing=1
            elif ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::warning::$(git show -s --format='%h %s' "$sha") — sign-off does not match the author ($author)"
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$missing" = 1 ]; then
            echo "Amend with: git commit --amend -s   (or: git rebase --signoff $BASE)"
            echo "What you are certifying is in the DCO file at the repo root."
            exit 1
          fi
          echo "all commits signed off"

  frontend-checks:
    # The SPA had NO automated check but `tsc`: no linter, no unit tests. So a
    # stale hook dependency, an unreachable branch, a click handler on a
    # non-interactive element or a duplicated JSX prop all shipped green, and
    # three `eslint-disable-next-line react-hooks/exhaustive-deps` comments sat in
    # the tree naming a rule no configured linter could run.
    #
    # Biome rather than ESLint, and not by preference: typescript-eslint refuses
    # to load against TypeScript 7 ("typescript-eslint does not support TS 7.0",
    # tracking issue typescript-eslint#10940), and this project is on ~7.0.2.
    # Biome ships its own parser, so it is version-independent. Revisit if/when
    # typescript-eslint supports TS >=7.1.
    #
    # `biome lint` exits non-zero on errors only; the useExhaustiveDependencies
    # and noArrayIndexKey findings are warnings on purpose — see frontend/biome.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test

  shellcheck:
    # deploy/ is now several hundred lines of shell that every install runs
    # first. Nothing was linting it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # agent/install.sh is the only path that writes into the NemoClaw sandbox,
      # and a shell bug there is silent (see tests/test_install_scope_contract.py).
      - run: shellcheck -S warning deploy/*.sh bin/ava qa/run.sh run.sh run_bridge.sh agent/install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  frontend-dist-drift:
    # The bridge serves the prebuilt bundle, so frontend/dist is tracked. Rebuild
    # and fail if dist drifts from src — a PR that changes src must commit the
    # rebuilt dist.
    #
    # The Node version comes from frontend/.nvmrc, not a literal here. This job
    # byte-compares a bundle, so the interpreter is part of the contract: it used
    # to pin "20" while package.json's engines allowed `^20.19.0 || >=22.12.0`,
    # so a contributor on 22 committed a dist this job could not reproduce and got
    # a diff they did not make. frontend/scripts/ensure-deps.mjs enforces the same
    # pin locally, before the build rather than after the push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      - name: Assert dist is in sync with src
        run: |
          if ! git diff --exit-code -- frontend/dist; then
            echo "::error::frontend/dist is out of date — run 'npm run build' in frontend/ and commit the result."
            exit 1
          fi

  smoke:
    # CPU-only boot: the bridge must start and serve /api/health with no model,
    # no agent runtime, and no voice deps installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Boot the bridge and probe health
        env:
          AVA_HOME: ${{ runner.temp }}/ava-home
          AVA_AGENT_ENABLED: "0"
        run: |
          python ava_cli.py setup --password ci-smoke-pass
          python serve.py &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8096/api/health >/dev/null 2>&1; then
              echo "health OK"; kill $SERVER_PID; exit 0
            fi
            sleep 2
          done
          echo "::error::bridge did not become healthy in time"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
      - name: Verify claims end-to-end (connectors, learning, governance)
        # Fails the build on generator drift, tool<->policy gaps, a secret path
        # that isn't denied, missing learning wiring, or the digest '?' bug.
        # Optional capabilities (voice) and down services only warn.
        env:
          AVA_HOME: ${{ runner.temp }}/ava-home
          AVA_AGENT_ENABLED: "0"
        run: python ava_cli.py verify

  qa:
    # The qa/ tier (~119 tests) is the only thing that imports phone_bridge.py and
    # exercises the real ASGI app: auth posture on every route, API contracts,
    # degradation paths. It was documented in CLAUDE.md as how you verify a change
    # and then never run by CI, so nothing enforced it. It is hermetic — temp
    # AVA_HOME, a fake LLM server on a free port, no GPU, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: bash qa/run.sh --backend

  qa-e2e:
    # Tier 3: the four browser specs, against a REAL bridge subprocess. Same
    # reason as the qa job above — it was advertised in qa/README.md and run
    # nowhere, except worse: its runner lived in the local-only demo/ tree, so
    # run_e2e.py skipped, returned 0, and run.sh printed "e2e: PASS" for a tier
    # that executed zero specs. In every clone. Forever.
    #
    # It is a separate job from `qa` because it needs Node and a browser
    # download, and the backend tier should not wait on that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The specs drive the BUILT bundle, so it has to exist before they run.
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm install            # postinstall fetches chromium
        working-directory: qa/e2e
      # Called directly rather than through qa/run.sh, which maps 77 to 0 so a
      # developer's skip does not fail their local suite. Here a skip IS the
      # failure: it means the runner or the bundle went missing and this job
      # went green having tested nothing, which is the silent-green it exists
      # to prevent.
      - name: Browser specs (a skip is a failure here)
        run: |
          set +e
          python qa/e2e/run_e2e.py
          rc=$?
          set -e
          if [ "$rc" = 77 ]; then
            echo "::error::qa-e2e skipped instead of running — no runner, or frontend/dist missing"
            exit 1
          fi
          exit "$rc"

  compose-config:
    # Fast signal, no images, ~20s. Kept separate from compose-smoke so the
    # cheap checks are never queued behind a multi-minute build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pytest too, not just pyyaml: the last step of this job runs
      # `python -m pytest`, and with only pyyaml installed it died with
      # "No module named pytest" — the job was red for a reason that had
      # nothing to do with what it tests.
      - run: pip install pyyaml pytest

      - name: Every shipped profile must interpolate and validate
        working-directory: deploy
        run: |
          set -euo pipefail
          for f in profiles/*.env; do
            p="$(basename "$f" .env)"
            if [ "$p" = "cloud" ]; then
              # cloud.env ships its three values EMPTY on purpose, so compose is
              # supposed to refuse it. Validate it the way a user would: filled in.
              tmp="$(mktemp)"; cat "$f" > "$tmp"
              printf 'AVA_BACKEND_URL=https://example.invalid/v1\nAVA_MODEL=stub\n' >> "$tmp"
              docker compose --env-file "$tmp" config >/dev/null
              rm -f "$tmp"
              # ...and assert it DOES refuse when they are left empty.
              if docker compose --env-file "$f" config >/dev/null 2>&1; then
                echo "::error::cloud.env validates with empty values — it must fail loudly instead"
                exit 1
              fi
            else
              docker compose --env-file "$f" config >/dev/null
            fi
            echo "  ok: $p"
          done

      - name: A profile must start the service its own backend URL names
        # The defect this job exists for: `--profile cpu` pointed the bridge at
        # http://vllm:8002/v1, and no vllm service exists in that profile.
        run: python -m pytest tests/test_deploy_compose_contract.py tests/test_model_flags_ssot.py tests/test_dockerfile_bind.py -q

  install-smoke:
    # deploy/install.sh writes deploy/.env. It previously wrote nothing at all,
    # which is why the cpu profile shipped with no backend wired. It also has to
    # never destroy a hand-written secret on re-run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Writes a valid .env for a profile
        working-directory: deploy
        run: |
          set -euo pipefail
          AVA_INSTALL_DRY_RUN=1 AVA_PROFILE=cpu bash install.sh
          grep -q '^COMPOSE_PROFILES=cpu$' .env
          grep -q '^AVA_BACKEND_URL=http://ollama:11434/v1$' .env
          docker compose config >/dev/null

      - name: Preserves hand-written values across a re-run
        working-directory: deploy
        run: |
          set -euo pipefail
          printf 'AVA_PASSWORD=ci-precious\nAVA_INFERENCE_KEY=sk-ci-precious\n' >> .env
          AVA_INSTALL_DRY_RUN=1 AVA_PROFILE=gpu bash install.sh
          grep -q 'ci-precious' .env       || { echo "::error::install.sh destroyed AVA_PASSWORD"; exit 1; }
          grep -q 'sk-ci-precious' .env    || { echo "::error::install.sh destroyed AVA_INFERENCE_KEY"; exit 1; }
          test "$(grep -c '>>> ava managed' .env)" = "1" \
            || { echo "::error::install.sh left more than one managed block"; exit 1; }

          # vLLM flags belong to the profile install.sh RESOLVED, not the one we
          # asked for. This step used to assert `^AVA_VLLM_MODEL_FLAGS=` outright
          # after requesting gpu, which was true when it was written: back then the
          # whole hardware block sat behind `if [ -z "$AVA_PROFILE" ]`, so a pinned
          # profile skipped detection and was honoured verbatim. It is not true now.
          # install.sh applies the sizing and runtime gates to a PINNED profile too,
          # so on a runner with no nvidia-smi it deliberately falls back gpu -> cpu —
          # correctly, because vLLM has no useful CPU mode (deploy/local-serve.sh
          # refuses rather than starting a doomed container) and a cpu .env serves
          # through Ollama. The old assertion therefore demanded a gpu-only variable
          # that must NOT be in a cpu .env, and CI went red on correct behaviour.
          #
          # Assert the real invariant instead, in BOTH directions, which is strictly
          # stronger: today's check also passed on a .env that wrote gpu flags into a
          # cpu profile, and passed on an EMPTY value — the exact silent-mis-parse
          # the flags exist to prevent.
          #
          # The condition is read off the engine the .env actually wired, not a list
          # of profile names restated here. AVA_BACKEND_ENGINE=vllm holds for exactly
          # gpu/agent, which is exactly the set install.sh resolves flags for
          # (install.sh) and the set that starts the vllm service
          # (docker-compose.yml), so the three cannot drift apart silently. It is also
          # deliberately not `docker compose config --services`: whether that honours
          # COMPOSE_PROFILES varies by Compose version, and a check whose meaning
          # depends on the runner's CLI build is the kind of thing this repo keeps
          # getting burned by.
          _managed="$(awk '/^# >>> ava managed/{f=1; next} /^# <<< ava managed/{f=0} f' .env)"
          # `|| true` so a missing line reaches the guard below as an empty string.
          # Without it `set -o pipefail` aborts the step here with no message, and a
          # check that dies silently is indistinguishable from one that never ran.
          _engine="$(grep '^AVA_BACKEND_ENGINE=' <<<"$_managed" | tail -1 | cut -d= -f2- || true)"
          test -n "$_engine" \
            || { echo "::error::install.sh's managed block wired no AVA_BACKEND_ENGINE, so the bridge has no engine — and the flag check below would have silently taken its no-vLLM branch and stopped biting. Managed block was: ${_managed:-<empty>}"; exit 1; }
          echo "resolved: $(grep '^COMPOSE_PROFILES=' <<<"$_managed"), engine $_engine"
          if [ "$_engine" = "vllm" ]; then
            if ! grep -qE '^AVA_VLLM_MODEL_FLAGS=.+' <<<"$_managed"; then
              echo "::error::this .env serves on vLLM but install.sh resolved no vLLM flags — docker-compose.yml then falls back to its hardcoded '--tool-call-parser hermes', which returns no tool calls at all on a model that does not speak it, with no error anywhere"
              exit 1
            fi
            echo "engine is vllm, and the flags are resolved:"
            grep '^AVA_VLLM_MODEL_FLAGS=' <<<"$_managed"
          else
            if grep -q '^AVA_VLLM_MODEL_FLAGS=' <<<"$_managed"; then
              echo "::error::install.sh wrote vLLM flags into a .env that serves on '$_engine', not vLLM — dead config that would take effect the moment someone flipped COMPOSE_PROFILES by hand"
              exit 1
            fi
            echo "engine is $_engine, not vllm, and there are no vLLM flags — as it should be"
          fi

      - name: A gpu install resolves the model's vLLM flags
        # The positive half of the invariant above, which no runner can reach on
        # its own hardware — so inject the one FACT install.sh's gpu path needs
        # (how much VRAM there is) and test the RULE off the machine it describes.
        # Same trick the repo already uses to fake docker in tests.
        #
        # Without this step, making the check above conditional would leave the gpu
        # branch of install.sh's flag resolution with no coverage at all. Note that
        # it has had none since the fallback landed: the old assertion did not test
        # the gpu path, it just failed.
        #
        # This also covers the cpu -> gpu profile SWITCH, since it re-runs over the
        # .env the previous step left behind.
        working-directory: deploy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/nvidia-smi" <<'FAKE'
          #!/bin/sh
          # Enough nvidia-smi for install.sh: how much VRAM. 24564 MiB clears the
          # 18000 MiB the default 7B needs (14.2 GiB weights + a 32k KV cache at
          # 0.90 utilization), so the model must NOT be downshifted.
          case "$*" in
            *memory.total*) echo 24564 ;;
            *) echo "fake nvidia-smi — there is no GPU on a CI runner" ;;
          esac
          FAKE
          chmod +x "$RUNNER_TEMP/fakebin/nvidia-smi"

          # AVA_SKIP_GPU_RUNTIME_CHECK: a runner's docker has no 'nvidia' runtime
          #   registered, and that gate is a second, independent fallback to cpu.
          # AVA_GPU_MEMORY_MODEL=discrete: makes the HAL report a discrete card, so
          #   the VRAM number above is actually consumed instead of skipped as it is
          #   on unified memory. The assertions below hold under either answer — the
          #   override just pins which branch runs.
          PATH="$RUNNER_TEMP/fakebin:$PATH" \
            AVA_INSTALL_DRY_RUN=1 AVA_PROFILE=gpu \
            AVA_GPU_MEMORY_MODEL=discrete AVA_SKIP_GPU_RUNTIME_CHECK=1 \
            bash install.sh

          # Prove the injection worked before trusting anything downstream: if a
          # fallback still fired, this step would otherwise assert nothing.
          grep -q '^COMPOSE_PROFILES=gpu$' .env \
            || { echo "::error::the gpu profile did not survive — install.sh fell back despite the injected VRAM, so this step tested nothing. Resolved: $(grep '^COMPOSE_PROFILES=' .env)"; exit 1; }
          grep -q '^AVA_BACKEND_URL=http://vllm:8002/v1$' .env \
            || { echo "::error::a gpu .env must point the bridge at the vllm service"; exit 1; }

          # A non-empty flag string, and the SAME one the resolver gives for this
          # model. install.sh runs the resolver as `... 2>/dev/null || true`, so a
          # resolver that broke would write NOTHING and compose would quietly serve
          # with its hardcoded default parser.
          _model="$(grep '^AVA_MODEL=' .env | tail -1 | cut -d= -f2- || true)"
          test -n "$_model" \
            || { echo "::error::the gpu .env names no AVA_MODEL, so there is nothing to resolve flags for"; exit 1; }
          if ! _resolver="$(bash ./resolve-model-flags.sh --env "$_model" 2>&1)"; then
            echo "::error::deploy/resolve-model-flags.sh itself failed for $_model. install.sh runs it as '|| true', so a broken resolver writes NO flags at all and compose serves with its hardcoded default parser instead — silently. Resolver said: $_resolver"
            exit 1
          fi
          _want="$(grep '^AVA_VLLM_MODEL_FLAGS=' <<<"$_resolver" || true)"
          case "$_want" in
            ''|'AVA_VLLM_MODEL_FLAGS=')
              echo "::error::the resolver produced no flags for $_model, so the assertion below could not bite — add a row to deploy/model-flags.conf. Resolver said: $_resolver"
              exit 1 ;;
          esac
          grep -qxF "$_want" .env \
            || { echo "::error::install.sh wrote flags that disagree with deploy/resolve-model-flags.sh for $_model. wanted: $_want / got: $(grep '^AVA_VLLM_MODEL_FLAGS=' .env || echo '<nothing>')"; exit 1; }
          echo "gpu resolved: $_want"

          # 24564 MiB is above install.sh's 18000 MiB gate, so the sizing code must
          # NOT have downshifted the model. Read the expectation out of the profile
          # rather than naming a model here, or changing the shipped default turns
          # this step red for no reason.
          _default_model="$(grep '^AVA_MODEL=' profiles/gpu.env | head -1 | cut -d= -f2-)"
          test "$_model" = "$_default_model" \
            || { echo "::error::24564 MiB clears the 18000 MiB gate, but install.sh still changed the model: profiles/gpu.env ships $_default_model and .env got $_model"; exit 1; }

          # And the switch still did not eat the hand-written secrets.
          grep -q 'ci-precious' .env \
            || { echo "::error::a cpu -> gpu profile switch destroyed the hand-written values"; exit 1; }

      - name: Rejects an unknown profile
        working-directory: deploy
        run: |
          if AVA_INSTALL_DRY_RUN=1 AVA_PROFILE=nonsense bash install.sh 2>/dev/null; then
            echo "::error::install.sh accepted an unknown profile"; exit 1
          fi

  compose-smoke:
    # Docker is the install path README.md recommends first, and NOTHING built or
    # booted it in CI — deploy/agent.Dockerfile had never been built by any
    # automation at all. Every Docker-specific defect found in the July audit (the
    # internal-token path, perf logs written to the ephemeral layer, an unbuildable
    # agent image) was downstream of that single gap, and none of them can happen
    # on the maintainer's bare-metal box.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the bridge image
        run: docker build -f deploy/Dockerfile -t ava/bridge:ci .

      - name: Build the agent-runtime image
        # Kept separate so a break here is legible: this image had never been
        # built by CI, so nothing caught a bad layer until someone ran it.
        run: docker build -f deploy/agent.Dockerfile -t ava/agent-runtime:ci .

      - name: Start the stub backend
        # OpenAI-shaped enough for the router to consider the backend real. This
        # asserts the container BOOTS and SERVES, not that inference works.
        run: |
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def _send(self, obj):
                  b = json.dumps(obj).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)
              def do_GET(self):
                  self._send({"data": [{"id": "stub-model"}]})
              def do_POST(self):
                  self._send({"choices": [{"message": {"role": "assistant",
                                                       "content": "ok"}}]})
              def log_message(self, *a):
                  pass
          HTTPServer(("0.0.0.0", 9999), H).serve_forever()
          PY
          sleep 2

      - name: First run with NO password must be claimable from the host
        # The install path a novice actually takes. Every other compose step here
        # presets AVA_PASSWORD, which disarms first-run setup entirely — so the
        # unclaimed path, the ONLY one a fresh forker sees, was never exercised.
        # It was broken: compose publishes through the docker bridge, so the peer
        # address the container observes is the gateway, never 127.0.0.1, and
        # `may_claim` refused every browser while install.sh printed "the first
        # screen lets you set your admin password".
        #
        # Assert both halves: the gate IS armed through the published port (not
        # accidentally wide open), and the token install.sh reads off the mounted
        # volume actually opens it.
        working-directory: deploy
        run: |
          set -euo pipefail
          _home="${{ runner.temp }}/ava-home-unclaimed"
          mkdir -p "$_home"
          cp profiles/cloud.env .env
          cat >> .env <<ENV
          AVA_BACKEND_URL=http://127.0.0.1:9999/v1
          AVA_BACKEND_ENGINE=openai
          AVA_MODEL=stub-model
          AVA_HOME=$_home
          ENV
          cat > docker-compose.override.yml <<'YML'
          services:
            ava:
              image: ava/bridge:ci
          YML
          docker compose up -d

          ok=0
          for _ in $(seq 1 60); do
            curl -fsS --max-time 3 http://127.0.0.1:8096/api/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::unclaimed stack never answered"; docker compose logs --tail 60 ava; exit 1; }

          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8096/setup)"
          [ "$code" = 403 ] || { echo "::error::/setup returned $code, expected 403 — the claim gate is not armed through the published port"; exit 1; }
          echo "claim gate is armed (403 without a token)"

          # Resolve the token exactly as deploy/install.sh does, in the same order:
          # host file, then `exec cat`, then the startup line in the logs. Reading only
          # the host file is what this step used to do, and it asserted something
          # FALSE: the container declares no USER so it runs as root, auth.py writes
          # the token 0600 because it is a bearer token, and a normal host user
          # therefore cannot read it through the bind mount — which is the situation
          # for essentially every real installer, and it failed here with a bare
          # "Permission denied" rather than a diagnosis. install.sh has two fallbacks
          # now; if this step kept only the host read it would go red on a working
          # product, and worse, it would stop testing the path users actually take.
          tok="$(tr -d '[:space:]' < "$_home/data/setup_claim" 2>/dev/null || true)"
          [ -n "$tok" ] || tok="$(docker compose exec -T ava cat /data/data/setup_claim 2>/dev/null | tr -d '[:space:]' || true)"
          [ -n "$tok" ] || tok="$(docker compose logs ava 2>/dev/null | sed -n 's|.*/setup?claim=\([A-Za-z0-9_-]\{8,\}\).*|\1|p' | tail -1)"
          [ -n "$tok" ] || { echo "::error::no setup_claim token reachable by ANY route install.sh uses (host read, exec, startup logs) — first run is a dead end for every forker"; docker compose logs --tail 40 ava; exit 1; }
          echo "token resolved (the same way install.sh resolves it)"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:8096/setup?claim=$tok")"
          [ "$code" = 200 ] || { echo "::error::/setup?claim=<token> returned $code, expected 200 — first run is unreachable for every forker"; exit 1; }
          echo "claim link works — a fresh install can reach the password form"

          # RENDERING the form is not COMPLETING first run, and the difference is
          # not academic: setup.html posted to a bare /setup while may_claim()
          # reads the claim from the query string, so the token was dropped on
          # submit and every Docker install 403'd at the password step. This step
          # stopped at the 200 above and called it green. Post where the form
          # actually points, so the assertion is "a fresh install can FINISH".
          action="$(curl -s --max-time 5 "http://127.0.0.1:8096/setup?claim=$tok" \
                    | sed -n 's|.*<form[^>]*action="\([^"]*\)".*|\1|p' | head -1)"
          case "$action" in
            *"claim=$tok"*) ;;
            *) echo "::error::the password form posts to '$action', which drops the claim — submitting it cannot pass may_claim(), so first run cannot complete"; exit 1 ;;
          esac
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
                    --data 'password=ci-first-run-pw&confirm=ci-first-run-pw' \
                    "http://127.0.0.1:8096${action}")"
          [ "$code" = 303 ] || { echo "::error::POST to the form's own action returned $code, expected 303 — a fresh install cannot set a password"; docker compose logs --tail 40 ava; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8096/setup)"
          [ "$code" = 303 ] || { echo "::error::/setup returned $code after the password was set, expected 303 to /login — the instance did not actually become claimed"; exit 1; }
          echo "first run COMPLETES — password set, setup closed"

          docker compose down -v
          rm -f docker-compose.override.yml

      - name: Boot through docker compose and probe the PUBLISHED port
        # This step used to `docker run --network host`, which put the container
        # in the runner's own namespace — the one mode where a process bound to
        # in-namespace loopback IS reachable at 127.0.0.1. It therefore could not
        # catch the bug it existed to catch: the image bound 127.0.0.1 inside its
        # namespace, so the published port refused every connection while the
        # container reported healthy. It also never exercised `ports:` at all.
        #
        # Now: the real compose file, the default bridge network, and a curl from
        # the RUNNER through the published mapping. Both assertions matter — a
        # healthy container whose port refuses connections is the exact failure.
        working-directory: deploy
        run: |
          set -euo pipefail
          cp profiles/cloud.env .env
          cat >> .env <<'ENV'
          AVA_BACKEND_URL=http://host.docker.internal:9999/v1
          AVA_BACKEND_ENGINE=openai
          AVA_MODEL=stub-model
          AVA_PASSWORD=ci-compose-pass
          AVA_HOME=${{ runner.temp }}/ava-home
          ENV
          # CI-only: let the container reach the stub on the runner's host.
          cat > docker-compose.override.yml <<'YML'
          services:
            ava:
              image: ava/bridge:ci
              extra_hosts:
                - "host.docker.internal:host-gateway"
          YML
          mkdir -p "${{ runner.temp }}/ava-home"
          docker compose up -d

          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:8096/api/health >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::the published port never answered — the bridge is unreachable from the host"
            docker compose ps
            docker compose logs --tail 60 ava
            exit 1
          fi
          echo "published port answers from the host"

          # A green healthcheck alongside a dead published port is the failure
          # mode this job missed before, so assert BOTH and say which one broke.
          state="$(docker compose ps --format json ava | python3 -c 'import json,sys; print(json.loads(sys.stdin.read().strip().splitlines()[0]).get("Health") or "none")')"
          echo "compose reports health: $state"
          if [ "$state" = "unhealthy" ]; then
            echo "::error::container is unhealthy even though the port answered"
            docker compose logs --tail 60 ava
            exit 1
          fi

      - name: State must land on the mounted volume, not the image layer
        # The exact class of bug the audit found: writes anchored on the CODE root
        # (/app) instead of AVA_HOME (/data) vanish with the container and are
        # invisible to the bridge, which reads the volume.
        working-directory: deploy
        run: |
          set -euo pipefail
          test -d "${{ runner.temp }}/ava-home/data" \
            || { echo "::error::AVA_HOME/data was not created on the volume"; exit 1; }
          if docker compose exec -T ava sh -c 'ls /app/data /app/logs 2>/dev/null | head -1' | grep -q .; then
            echo "::error::runtime state was written to the code root (/app) instead of AVA_HOME"
            docker compose exec -T ava sh -c 'ls -la /app/data /app/logs 2>/dev/null' || true
            exit 1
          fi
          echo "state is on the volume"

      - name: Tear down cleanly
        working-directory: deploy
        run: |
          docker compose down
          test -z "$(docker compose ps -q)" || { echo "::error::containers survived compose down"; exit 1; }

      - name: Container logs (always)
        if: always()
        working-directory: deploy
        run: docker compose logs --tail 40 ava 2>&1 || true

  secrets-scan:
    # Dependabot runs get a read-only token, and the action's PR API calls
    # (comments in v2, listing PR commits in v3) 403 with "Resource not
    # accessible by integration" — unfixable via env. Bot PRs only touch
    # manifests/lockfiles; pushes to master still get the full scan.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # gitleaks-action lists PR commits + comments findings
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    # Fail a PR that breaks a docs link before it reaches the publish workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: python docs-site/sync.py
      - run: mkdocs build --strict -f docs-site/mkdocs.yml

      - name: No list was swallowed into a paragraph
        # `--strict` catches broken LINKS. It says nothing about markdown that
        # parses without error and renders WRONG, which is what this checks and
        # what shipped unnoticed to the published site.
        #
        # GitHub's renderer accepts a 2-space continuation block inside a list
        # item; Python-Markdown needs 4. deploy/README.md had items whose second
        # paragraph and table were indented 2, so on the site those blocks broke
        # OUT of the list, and every following `- ` marker was then read as lazy
        # continuation and absorbed into the same paragraph. One <p> ended up
        # holding 3576 characters and nine items' worth of text. It looked correct
        # on GitHub, which is why nobody caught it.
        #
        # Assert against the BUILT HTML, not the source: a list marker at the start
        # of a line inside a rendered <p> means a list did not become a list.
        # Scanning the source was tried first and flagged 321 false positives — a
        # wrapped continuation line and a prose line are indistinguishable without
        # tracking list state, and "fixing" those made three pages worse.
        run: |
          python3 - <<'PY'
          import html, pathlib, re, sys
          root = pathlib.Path("docs-site/site")
          pages = sorted(root.rglob("index.html"))
          if not pages:
              print("::error::no built pages found — did mkdocs build actually run?")
              sys.exit(1)
          bad = []
          for f in pages:
              m = re.search(r"<article[^>]*>(.*?)</article>",
                            f.read_text(encoding="utf-8", errors="replace"), re.S)
              if not m:
                  continue
              body = re.sub(r"<pre.*?</pre>", "", m.group(1), flags=re.S)
              for para in re.findall(r"<p>(.*?)</p>", body, re.S):
                  txt = html.unescape(re.sub(r"<[^>]+>", "", para)).strip()
                  hits = re.findall(r"\n\s*[-*+]\s+\S", txt)
                  if hits:
                      bad.append((f.parent.relative_to(root), len(hits), txt[:100]))
          print(f"checked {len(pages)} built pages")
          for page, n, sample in bad:
              print(f"::error::{page}: {n} list marker(s) swallowed into a paragraph."
                    f" Indent continuation blocks by 4 spaces and leave a blank line"
                    f" before the next item. Paragraph begins: {sample!r}")
          sys.exit(1 if bad else 0)
          PY
