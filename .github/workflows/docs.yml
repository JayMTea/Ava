name: Docs

# Build the MkDocs site (docs-site/) and publish it to GitHub Pages on pushes to
# master that touch docs. The build is --strict, so a broken internal link fails
# the job before anything is published.

on:
  push:
    branches: [master, main]
    paths:
      - "**/*.md"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Stage docs
        run: python docs-site/sync.py
      - name: Build (strict)
        run: mkdocs build --strict -f docs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
