name: Docs

# Publish documentation after privacy checks and a strict MkDocs build.
# Forks must enable GitHub Pages with GitHub Actions as the publishing source.
# URLs come from the repository and Pages configuration below.
on:
  push:
    branches: [master, main]
    paths:
      - "**/*.md"
      - "**/*.svg"          # diagrams are published on the site
      # Asset-only updates must also rebuild the published site.
      - "docs/assets/**"
      - "docs-site/**"
      - "frontend/src/styles/tokens.css"  # the site inherits the app palette
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep source links and the repository widget aligned with this fork.
    env:
      AVA_DOCS_REPO_BASE: ${{ github.server_url }}/${{ github.repository }}
      AVA_DOCS_REPO_NAME: ${{ github.repository }}
      AVA_DOCS_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt -r requirements-dev.txt
      - name: Check public source and assets
        env:
          AVA_PRIVATE_NAMES: ${{ secrets.AVA_PRIVATE_NAMES }}
        run: python -m pytest tests/test_no_owner_identity.py tests/test_no_private_apps_shipped.py tests/test_no_internal_plans.py tests/test_docs_assets.py tests/test_landing_page.py -q
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set site URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: echo "AVA_DOCS_SITE_URL=${SITE_URL}/" >> "$GITHUB_ENV"
      - name: Stage docs
        run: python docs-site/sync.py
      - name: Build (strict)
        run: mkdocs build --strict -f docs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
