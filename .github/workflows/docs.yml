name: Docs

# Build the MkDocs site (docs-site/) and publish it to GitHub Pages on pushes to
# master that touch docs. The build is --strict, so a broken internal link fails
# the job before anything is published.

# PRE-LAUNCH: auto-publish is gated off. A GitHub Pages site is public even when
# the repo is private (access control is Enterprise-only), so every push to
# master used to republish this site to the open web. Pages is currently set
# public=false; leaving the push trigger on risked a redeploy flipping it back.
# Publishing is manual until launch — run the workflow from the Actions tab.
# TO RE-ENABLE AT LAUNCH: uncomment the `push:` block below.
on:
  # push:
  #   branches: [master, main]
  #   paths:
  #     - "**/*.md"
  #     - "**/*.svg"          # diagrams are published on the site
  #     - "docs-site/**"
  #     - "frontend/src/styles/tokens.css"  # the site inherits the app palette
  #     - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Stage docs
        run: python docs-site/sync.py
      - name: Build (strict)
        run: mkdocs build --strict -f docs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
