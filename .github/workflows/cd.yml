# Optional deployment to an operator-owned runner. Configure NAS_DEPLOY=true and NAS_STACK_DIR.
# deploy/nas and instance overlays are receiver-owned and protected from rsync deletion.
name: CD


on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-nas
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to NAS
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch)) &&
      vars.NAS_DEPLOY == 'true'
    runs-on: ${{ fromJSON(vars.AVA_DEPLOY_RUNNER_LABELS || '["self-hosted","nas"]') }}
    timeout-minutes: 90
    env:
      STACK_DIR: ${{ vars.NAS_STACK_DIR }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require successful CI for the selected commit
        uses: actions/github-script@v8
        env:
          VERIFIED_SHA: ${{ env.DEPLOY_SHA }}
        with:
          script: |
            const gate = require('./deploy/scripts/require_ci.js');
            await gate({github, context, core, sha: process.env.VERIFIED_SHA});
      - name: Record verification
        run: echo 'GATES=passed for selected commit' >> "$GITHUB_ENV"

      - name: Preflight — the NAS, the stack directory, the env file
        run: |
          set -euo pipefail
          for bin in docker rsync; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "::error::$bin is not on the runner PATH"; exit 1; }
          done
          docker compose version >/dev/null 2>&1 || {
            echo "::error::docker compose v2 is not available to the runner user (is it in the docker group?)"; exit 1; }
          test -n "$STACK_DIR" && test "$STACK_DIR" != / && [[ "$STACK_DIR" = /* ]] || {
            echo "::error::Set NAS_STACK_DIR to the absolute path of the existing stack checkout"; exit 1; }
          STACK_DIR="$(realpath "$STACK_DIR")"
          test "$STACK_DIR" != / || exit 1
          echo "STACK_DIR=$STACK_DIR" >> "$GITHUB_ENV"
          test -d "$STACK_DIR" || {
            echo "::error::$STACK_DIR does not exist. The FIRST install is by hand (deploy/README.md); this job rolls a stack that already exists."; exit 1; }
          test -f "$STACK_DIR/deploy/.env" || {
            echo "::error::no deploy/.env in $STACK_DIR — it is hand-written on the NAS and never synced from git."; exit 1; }
          test -r "$STACK_DIR/deploy/.env" || {
            echo "::error::$STACK_DIR/deploy/.env exists but this runner cannot read it (it is 0600). Hand the stack over: sudo chown -R \"\$(id -un)\":users $STACK_DIR"; exit 1; }
          case "$GITHUB_WORKSPACE/" in
            "$STACK_DIR"/*) echo "::error::this runner's workspace ($GITHUB_WORKSPACE) is inside $STACK_DIR, which the deploy rsyncs --delete. Reinstall the runner outside the stack directory."; exit 1 ;;
          esac
          if grep -qE '^AVA_PASSWORD=.+' "$STACK_DIR/deploy/.env"; then
            echo "::warning::deploy/.env pins AVA_PASSWORD, so the in-app password change is refused (409). Clear it to manage the password from Setup."
          fi

      - name: Resolve the compose file set
        run: |
          set -euo pipefail
          if grep -qE '^COMPOSE_FILE=' "$STACK_DIR/deploy/.env"; then
            echo "from deploy/.env: $(grep -E '^COMPOSE_FILE=' "$STACK_DIR/deploy/.env")"
          else
            echo "no COMPOSE_FILE in deploy/.env — compose will use docker-compose.yml + docker-compose.override.yml"
          fi

      - name: Sync the tree into the stack directory
        run: |
          set -euo pipefail
          instance_dir="$(sed -n 's/^AVA_HOME=//p' "$STACK_DIR/deploy/.env" | tail -1 | tr -d "\"' ")"
          echo "AVA_HOME on this NAS: ${instance_dir:-<unset, compose default ./ava-data>}"
          extra=()
          case "${instance_dir:-./ava-data}" in
            /*) case "$instance_dir/" in "$STACK_DIR/"*) extra+=(--exclude "/${instance_dir#"$STACK_DIR/"}/") ;; esac ;;                                    # absolute: outside the tree
            *)  extra+=(--exclude "deploy/${instance_dir#./}/") ;;
          esac
          # Protect locally installed connectors even when state lives in the checkout.
          while IFS= read -r private_id; do
            extra+=(--exclude "/connectors/$private_id/")
          done < <(python3 -c 'import json,pathlib,sys; root=pathlib.Path(sys.argv[1]); builtins=set(json.loads(pathlib.Path("connectors/builtins.json").read_text())); print("\n".join(p.name for p in root.iterdir() if p.is_dir() and p.name not in builtins and p.name != "_template")) if root.is_dir() else None' "$STACK_DIR/connectors")
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'deploy/.env' \
            --exclude 'deploy/.env.*' \
            --exclude 'deploy/docker-compose.override.yml*' \
            --exclude 'deploy/*.bak*' \
            --exclude 'deploy/*.pre-*' \
            --exclude 'deploy/ava-data/' \
            --exclude '/deploy/nas/' \
            --exclude '/overlay/' \
            --exclude '/frontend/src/overlay/' \
            --exclude '/extensions/' \
            --exclude '/runtime_adapters/' \
            --exclude '/branding/' \
            --exclude '/alloc_drivers/' \
            --exclude '/ava.yaml*' \
            --exclude '/.env*' \
            --exclude '/domains.yaml*' \
            --exclude '/connector_grants.yaml' \
            --exclude '/connector_tools_cache.json' \
            --exclude '/agent/policies/generated/' \
            --exclude '/agent/mcp_server_connectors/apps/' \
            --exclude '/backups/' \
            --exclude '/run/' \
            --exclude '/data/' \
            --exclude '/logs/' \
            --exclude '/secrets/' \
            --exclude '/models/' \
            --exclude '/media/' \
            --exclude '/enroll/*.wav' \
            --exclude '/enroll/*.m4a' \
            --exclude 'node_modules/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.ruff_cache/' \
            "${extra[@]}" \
            ./ "$STACK_DIR/"

      - name: Tag the running images as previous
        working-directory: ${{ env.STACK_DIR }}/deploy
        run: |
          set -euo pipefail
          kept=''
          while read -r img; do
            case "$img" in *@sha256:*) continue ;; esac
            if docker image inspect "$img" >/dev/null 2>&1; then
              docker tag "$img" "${img%:*}:previous"
              echo "  ${img%:*}:previous -> $(docker image inspect --format '{{.Id}}' "$img" | cut -c8-19)"
              kept="${kept:+$kept }${img}"
            else
              echo "  $img is not on this NAS yet — nothing to keep"
            fi
          done < <(docker compose config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); print("\n".join(s["image"] for s in c["services"].values() if s.get("build") and s.get("image")))')
          echo "KEPT_IMAGES=$kept" >> "$GITHUB_ENV"

      - name: Build the images
        working-directory: ${{ env.STACK_DIR }}/deploy
        env:
          AVA_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          AVA_VERSION="$(tr -dc '0-9.' < "$STACK_DIR/VERSION")+nas.${DEPLOY_SHA:0:7}"
          export AVA_VERSION
          echo "building $AVA_VERSION ($AVA_REVISION)"
          docker compose build

      - name: Roll the stack
        working-directory: ${{ env.STACK_DIR }}/deploy
        run: |
          set -euo pipefail
          docker compose up -d
          docker compose up -d --wait --wait-timeout 300 ava || {
            echo "::error::the bridge did not come up healthy — last 80 lines"
            docker compose logs --tail=80 ava
            exit 1
          }

      - name: Verify the bridge is serving, and serving this commit
        working-directory: ${{ env.STACK_DIR }}/deploy
        run: |
          set -euo pipefail
          cid="$(docker compose ps -q ava)"
          test -n "$cid" || { echo "::error::the ava service has no container"; exit 1; }
          docker exec "$cid" curl -fsS http://127.0.0.1:8096/api/health
          echo
          echo "HEALTH=ok" >> "$GITHUB_ENV"
          rev="$(docker exec "$cid" printenv AVA_REVISION 2>/dev/null || true)"
          if [ -z "$rev" ]; then
            echo "::warning::the container reports no AVA_REVISION — cannot confirm which commit is serving."
          elif [ "$rev" = "$DEPLOY_SHA" ]; then
            echo "serving ${rev:0:12} — the commit this run deployed"
          else
            echo "::error::the container was built from ${rev:0:12}, but this run deployed ${DEPLOY_SHA:0:12}. The stack did not restart into the new image."
            exit 1
          fi


      - name: Summary
        if: always()
        run: |
          {
            echo "### Ava → NAS"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${DEPLOY_SHA:0:7}\` on \`$DEPLOY_REF\` |"
            echo "| gates | ${GATES:-unknown} |"
            echo "| stack | \`$STACK_DIR\` |"
            echo "| /api/health | ${HEALTH:-unreached} |"
            echo
            if [ -n "${KEPT_IMAGES:-}" ]; then
              echo "Rollback — retag and roll, no rebuild:"
              echo '```bash'
              echo "cd $STACK_DIR/deploy"
              for img in $KEPT_IMAGES; do
                echo "docker tag ${img%:*}:previous $img"
              done
              echo "docker compose up -d          # never 'down'"
              echo '```'
            else
              echo "No previous image was kept — nothing to roll back to, which
            means this was the first deploy onto this box."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
