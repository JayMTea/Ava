version: 2
updates:
  # Python runtime + dev/voice/docs extras.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # fastapi>=0.138 with starlette>=1.3 silently drops every route on a
      # prefixed APIRouter (kills the whole /api/hub/* API). Pinned in
      # requirements.txt; tests/test_fastapi_compat.py is the canary. Lift
      # these once the canary passes on the new combo.
      - dependency-name: fastapi
      - dependency-name: starlette

  # Frontend SPA.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-deps:
        patterns: ["*"]

  # The CI/release workflows themselves (pinned action versions).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
