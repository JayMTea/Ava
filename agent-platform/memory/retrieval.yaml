# How memory is recalled - automatically into each task's first message, and via memory.recall.
schema_version: 1
auto_recall: true              # inject top matches from the agent's readable namespaces at task start
k: 5
min_score: 0.2                 # fraction of query terms that must match (keyword backend)
max_chars: 4000                # hard cap on recalled text per task
recency_half_life_days: 30
recency_weight: 0.3            # 0 = relevance only, 1 = recency dominates
