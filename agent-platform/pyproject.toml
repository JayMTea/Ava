[project]
name = "ava-agent-platform"
version = "0.1.0"
description = "Private agent platform for Ava, the self-hosted personal assistant, with local inference and governed tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.78"]
openai = ["openai>=1.40"]
mcp = ["mcp>=1.2"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "ruff>=0.6"]
all = ["ava-agent-platform[anthropic,openai,mcp,otel,dev]"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime", "tools", "app", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["state", "artifacts", "integrations/ava/ava_agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
