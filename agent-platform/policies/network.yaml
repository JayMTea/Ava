# HARD ENFORCEMENT - outbound requests made BY TOOLS (browser.fetch and any tool that calls
# PolicyEngine.check_url). Model-provider traffic is infrastructure and is not governed here.
#
# allow_domains match the host and its subdomains (example.com covers docs.example.com).
# deny_private_networks blocks loopback, RFC 1918, link-local and cloud metadata addresses
# (SSRF), and is re-checked on every redirect hop.
#
# Empty allowlist = tools reach nothing. Add only the hosts the project's agents need.
schema_version: 1
default: deny
allow_domains: []
allow_schemes: [https]
deny_private_networks: true
max_response_bytes: 2000000
