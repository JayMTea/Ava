# Ava lint config. Default rule set (pyflakes + pycodestyle E4/E7/E9); the
# frontend, the private overlay, and generated/vendored trees are excluded.
target-version = "py312"
line-length = 100

extend-exclude = [
    "agent-platform",  # independent package; its CI runs scripts/check.py
    "app/frontend",
    "overlay",
    ".venv",
    "docs",
    "agent-platform/integrations/ava/mcp/servers/mcp_server_connectors/apps",
    "agent-platform/integrations/ava/policies/egress/generated",
]

[lint]
# Default select (E4, E7, E9, F) plus two rules that were being *documented*
# rather than enforced:
#
#   BLE001  — `except Exception`. The repo already had 342 `# noqa: BLE001`
#             markers, over a hundred carrying a written rationale, for a rule
#             that was never switched on. The convention was real and the
#             enforcement was decorative, so a new broad except cost nothing to
#             add and read as normal.
#   RUF100  — dead `# noqa`. Necessary alongside BLE001, and worth having on its
#             own: without it a suppression outlives the problem it suppressed
#             and quietly widens.
#
# These two interlock. With BLE001 off, every `# noqa: BLE001` in the tree is a
# dead suppression, so RUF100 alone reported 420 errors; enabling both together
# leaves 0. Turning on only one of them is worse than neither.
select = ["E4", "E7", "E9", "F", "BLE", "RUF100"]

[lint.per-file-ignores]
# Broad excepts in tests, QA fakes and diagnostic scripts are not a production
# risk: a swallowed exception there fails the assertion or prints a warning,
# rather than turning into a silent None inside a request.
"tests/*" = ["BLE001"]
"tests/integration/*" = ["F821", "BLE001"]          # CLIENT/ANON globals injected by fixtures
"scripts/*" = ["BLE001"]
"docs/architecture/arch.py" = ["E741"]          # single-char loop vars in the d2 renderer
"app/backend/config_mgmt.py" = ["E722"]   # legacy best-effort restore
"agent-platform/integrations/ava/ava_agent/connectors.py" = ["E402"]    # `import re as _re` after the var table
"app/backend/log_mgmt.py" = ["F841"]      # legacy staged local
# The three legacy best-effort `except:` handlers moved out of app/server.py
# with the /internal router; the exemption follows the code rather than
# outliving it. (Worth fixing properly: a bare except also swallows
# KeyboardInterrupt/SystemExit inside a request handler.)
"app/backend/internal.py" = ["E722"]      # legacy best-effort handlers
"app/voice.py" = ["E702"]                # terse teardown line
