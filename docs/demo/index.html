<title>Ava</title>
<script>
  // Stamp the theme before first paint so there is no dark→light flash.
  // Mirrors the resolution order in src/lib/theme.ts (saved → OS → dark).
  (function () {
    try {
      var t = localStorage.getItem('ava.theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
