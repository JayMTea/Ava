<!-- Ava wordmark. Vector trace of the brand master
     frontend/public/assets/icons/AVA_logo_transparent_4x.png (the transparent
     4x PNG), simplified to its 50 real vertices — the letterforms are all
     straight edges, so this is the exact geometry, not an approximation.

     Filled with `currentColor` on purpose: the master's ink is #0f1927, which
     scores 15.9:1 on the light canvas but 1.06:1 on the dark one, i.e. it
     disappears. The docs apply this file as a CSS mask (.ava-wordmark in
     docs-site/stylesheets/extra.css) so one asset inks itself from the
     surrounding text color and stays legible in both schemes. -->
