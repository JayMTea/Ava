# Cost & energy estimation for the Ava dashboard.
#
# Local vLLM models cost $0 in API fees (only electricity). Cloud models (e.g. a
# connected app routing to Anthropic/OpenAI) have real per-token prices below.
# Prices are USD per 1,000,000 tokens. Keys are matched as substrings against the
# served model name, longest match wins.
electricity_rate_per_kwh: 0.15   # your $/kWh; set 0 to hide the $-energy figure

# Nominal GPU package power (watts), used ONLY when your GPU reports no live power
# and you want an estimate anyway. Left unset on purpose: it used to default to a
# flat 180, which is roughly a mid-range discrete NVIDIA card and wrong by up to an
# order of magnitude for a Mac mini (~10-30 W) or a Strix Halo APU (~50-120 W) — so
# the "estimate" was not an estimate of this machine.
#
# Unset means Ava falls back to the nominal for your detected PLATFORM
# (deploy/platforms.conf), and where there is no defensible figure it reports energy
# as NOT MEASURED rather than inventing one. Setting it here counts as YOU declaring
# your hardware's draw, which is also what unlocks the energy-in-currency figure.
# nominal_gpu_watts: 180

currency: "$"                    # display symbol for cost figures

# Spend/energy budgets. null = no budget (the meter + alert stay dormant). Set
# these here OR from the Setup hub → System → Budgets, which writes them to
# ava.yaml (cost.budgets.*) so a fork configures them without editing source.
budgets:
  daily_usd: null                # cloud API $ per day
  monthly_usd: null              # cloud API $ per rolling 30 days
  daily_kwh: null                # GPU energy per day

prices:
  "claude-opus":   { input: 15.0, output: 75.0 }
  "claude-sonnet": { input: 3.0,  output: 15.0 }
  "claude-haiku":  { input: 0.80, output: 4.0 }
  "gpt-4o-mini":   { input: 0.15, output: 0.60 }
  "gpt-4o":        { input: 2.50, output: 10.0 }
