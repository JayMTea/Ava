# Alert rules for the Ava dashboard. Evaluated server-side on each hardware
# sample / perf tick. Fields:
#   metric   — a key from dashboard.build_alert_metrics()
#   op       — one of >  <  >=  <=  ==
#   value    — threshold
#   for      — seconds a breach must persist before the alert RAISES (debounce)
#   cooldown — seconds to suppress re-raising after it clears (anti-flap)
#   severity — info | warn | critical
rules:
  - id: gpu_temp
    metric: gpu_temp
    op: ">"
    value: 85
    for: 30
    cooldown: 120
    severity: critical
    message: "GPU temperature high"
  - id: gpu_mem
    metric: mem_used_pct
    op: ">"
    value: 95
    for: 30
    cooldown: 120
    severity: critical
    message: "Unified memory nearly full"
  - id: gpu_power
    metric: gpu_power
    op: ">"
    value: 320
    for: 60
    cooldown: 120
    severity: warn
    message: "GPU power draw sustained high"
  - id: disk_low
    metric: disk_free_pct
    op: "<"
    value: 10
    for: 0
    cooldown: 300
    severity: critical
    message: "SSD free space low"
  - id: tok_s_low
    metric: tokens_per_sec
    op: "<"
    value: 15
    for: 0
    cooldown: 300
    severity: warn
    message: "LLM throughput below expected"
  - id: failover_rate
    metric: failover_rate_1h
    op: ">"
    value: 0.20
    for: 0
    cooldown: 300
    severity: warn
    message: "High inference failover rate"
  - id: error_rate
    metric: error_rate_1h
    op: ">"
    value: 0.10
    for: 0
    cooldown: 300
    severity: critical
    message: "High generation error rate"
  - id: service_down
    metric: service_down_count
    op: ">"
    value: 0
    for: 0
    cooldown: 60
    severity: critical
    message: "A monitored service is down"
  # Budget rules read a percent-of-budget metric, so the cap itself lives in
  # cost.yaml / ava.yaml (cost.budgets.*). The metric is 0 when no budget is
  # set, so these stay dormant until you configure a budget in the Setup hub.
  - id: budget_daily
    metric: budget_daily_pct
    op: ">="
    value: 100
    for: 0
    cooldown: 3600
    severity: critical
    message: "Daily cloud spend budget reached"
  - id: budget_daily_warn
    metric: budget_daily_pct
    op: ">="
    value: 80
    for: 0
    cooldown: 3600
    severity: warn
    message: "Daily cloud spend at 80% of budget"
  - id: budget_monthly
    metric: budget_monthly_pct
    op: ">="
    value: 100
    for: 0
    cooldown: 21600
    severity: critical
    message: "Monthly cloud spend budget reached"
  - id: budget_energy
    metric: budget_energy_pct
    op: ">="
    value: 100
    for: 0
    cooldown: 3600
    severity: warn
    message: "Daily GPU energy budget reached"
  - id: idle_burn
    metric: idle_burn_tokens_10m
    op: ">"
    value: 5000
    for: 60
    cooldown: 600
    severity: warn
    message: "Agent is generating tokens while idle"
  # Model-allocation rules. Every metric is 0 until you declare models in
  # `alloc.models` (ava.yaml), so these stay dormant on an install that has not
  # opted in — same convention as the budget rules above.
  - id: alloc_degraded
    metric: alloc_degraded_count
    op: ">"
    value: 0
    for: 0
    cooldown: 300
    severity: critical
    # The dangerous state: the process is up and its port answers, so no liveness
    # check notices, but the model never loaded. Left alone this runs for days.
    message: "A declared model is running but has no model loaded"
  - id: alloc_unfit
    metric: alloc_unfit_count
    op: ">"
    value: 0
    for: 1800
    cooldown: 1800
    severity: warn
    # `for: 1800` because not fitting is normal while something else legitimately
    # holds the pool — it is only a problem once it persists.
    message: "A declared model has been unable to start for a while"
  - id: alloc_unknown_hold
    metric: alloc_unknown_hold_gb
    op: ">"
    value: 24
    for: 600
    cooldown: 1800
    severity: warn
    message: "Undeclared processes are holding a large share of memory"
