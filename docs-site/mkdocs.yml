site_name: Ava
site_description: A self-hosted personal AI operating layer. Chat, voice, GPU workloads, and app automation on your own hardware.
site_url: https://JayMTea.github.io/Ava/
repo_url: https://github.com/JayMTea/Ava
repo_name: JayMTea/Ava
copyright: Apache-2.0 &middot; The Ava Authors

# Staged by docs-site/sync.py (an allow-list copy — see that script).
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides  # home.html — the landing page template
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    # No navigation.sections -> top-level sections render as collapsible dropdowns.
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-zoom.js  # zoom/pan lightbox for diagram SVGs
  - javascripts/carousel.js      # landing-page screenshot carousel
  - javascripts/chrome.js        # make the "Ava" title the home link

extra:
  generator: false  # hide "Made with Material for MkDocs" in the footer

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {}
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# The homepage (index.md) is reached via the "Ava" title in the header, so it is
# intentionally not listed here. Sections render as collapsible dropdowns.
validation:
  nav:
    omitted_files: ignore

nav:
  - Why Ava?: overview.md
  - Get started:
      - Quickstart (Docker): deploy/README.md
      - Connect your devices: docs/CONNECT_YOUR_DEVICES.md
      - Connect your apps: docs/CONNECT_YOUR_APPS.md
      - Agent runtime: docs/AGENT_RUNTIME.md
  - Connector SDK:
      - App connectors: docs/CONNECTOR_SDK.md
      - Device connectors: docs/DEVICE_CONNECTORS.md
  - Architecture:
      - Overview: agent/docs/README.md
      - Decision records: agent/docs/adr/index.md
  - Reference:
      - Security: SECURITY.md
      - Hardware support: docs/HWINFO_VALIDATION.md
      - Memory & recall: docs/MEMORY.md
      - On your phone (PWA): docs/MOBILE.md
