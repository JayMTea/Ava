site_name: Ava
site_description: A self-hosted personal AI operating layer. Chat, voice, GPU workloads, and app automation on your own hardware.
site_url: https://JayMTea.github.io/Ava/
# PRE-LAUNCH: the repo is private, so github.com/JayMTea/Ava is a 404 to anyone
# who is not a collaborator. Publishing the site with a repo widget would ship a
# dead "View on GitHub" pill on every page, so the widget is driven by the SAME
# switch as sync.py's source-link rewriting: set AVA_DOCS_REPO_BASE when the
# repo goes public and both light up together. Unset, Material renders no
# widget and javascripts/chrome.js skips the pill (it no-ops without the anchor).
repo_url: !ENV [AVA_DOCS_REPO_BASE, ""]
repo_name: JayMTea/Ava
copyright: Apache-2.0 &middot; The Ava Authors

# Staged by docs-site/sync.py (an allow-list copy — see that script).
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides  # home.html — the landing page template
  language: en
  # A site that sells "nothing leaves your box" must not make its own visitors
  # fetch fonts from Google. `false` disables Material's webfont loading
  # entirely; stylesheets/extra.css declares the same families as a local-first
  # stack, so anyone who has Inter/JetBrains Mono installed still sees them.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    # No navigation.sections -> top-level sections render as collapsible dropdowns.
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/tokens.css  # the app's design tokens, staged by sync.py (SSOT)
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-zoom.js  # zoom/pan lightbox for diagram SVGs
  - javascripts/chrome.js        # make the "Ava" title the home link
  # carousel.js is NOT loaded: no page builds `.ava-carousel` any more (the
  # landing page uses the single <video class="ava-reel"> embed), so it was a
  # 93-line no-op fetched on every page. The file and its .ava-carousel styles
  # in stylesheets/extra.css are kept for whenever a gallery comes back.

extra:
  generator: false  # hide "Made with Material for MkDocs" in the footer

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {}
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        # `:ava-*:` glyphs, generated from the app's own icon set by sync.py.
        # Material only indexes custom icons listed here (it does NOT scan
        # custom_dir), and it resolves these paths against the CWD — both
        # spellings are listed so the build works from the repo root (what
        # CONTRIBUTING and both CI workflows use) or from docs-site/. A path
        # that does not exist simply contributes no icons.
        custom_icons:
          - docs-site/overrides/.icons
          - overrides/.icons

# The homepage (index.md) is reached via the "Ava" title in the header, so it is
# intentionally not listed here. Sections render as collapsible dropdowns.
validation:
  nav:
    omitted_files: ignore
  # MkDocs defaults these to `info`, which --strict does NOT fail on — so the
  # docs gate in CI was green while broken anchors shipped. Promote them to
  # warnings so `mkdocs build --strict` actually catches them.
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Why Ava?: overview.md
  - Capabilities:
      - Overview: docs/capabilities/index.md
      - Chat, voice & creation: docs/capabilities/chat.md
      - Vitals: docs/capabilities/vitals.md
      - Operations: docs/capabilities/operations.md
      - Data, memory & privacy: docs/capabilities/data.md
      - Apps, devices & MCP: docs/capabilities/connectors.md
      - "The agent: tools, skills & self-improvement": docs/capabilities/agent.md
  - Get started:
      - 1. Install on your hardware: deploy/README.md
      - 2. Pick a model: docs/CHOOSE_A_MODEL.md
      - 3. Set up the agent: docs/AGENT_RUNTIME.md
      - 4. Connect your apps: docs/CONNECT_YOUR_APPS.md
  - Connector SDK:
      - App connectors: docs/CONNECTOR_SDK.md
      - Device connectors: docs/DEVICE_CONNECTORS.md
      - Home Assistant: docs/CONNECT_HOME_ASSISTANT.md
  - Architecture:
      - Overview: agent/docs/README.md
      - Decision records: agent/docs/adr/index.md
  - Reference:
      - Security: SECURITY.md
      - Hardware support: docs/HWINFO_VALIDATION.md
      - Running two models: docs/ALLOCATION.md
      - Memory & recall: docs/MEMORY.md
      - Persona (your assistant's voice): docs/PERSONA.md
      - Proving it (attest + eval): docs/EVIDENCE.md
      - Voiceprint & biometrics: docs/BIOMETRICS.md
      - On your phone (PWA): docs/MOBILE.md
  - Project:
      - Contributing: CONTRIBUTING.md
      - Releasing: docs/RELEASING.md
      - Changelog: CHANGELOG.md
