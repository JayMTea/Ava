# Example HEALTH & FITNESS connector — "Stridewell".
#
# Stridewell is a fictional app invented for the examples and the screenshots. It
# exists to show what a real third-party integration looks like end to end, and to
# demonstrate the one thing a health app makes concrete: **health data is not the
# same tier as everything else.**
#
# Install it the same way a real one installs:
#   cp -r examples/stridewell "$AVA_HOME/connectors/stridewell"
#   python examples/stridewell/server.py &
# then restart Ava. "Stridewell" appears in the left rail with no edits to Ava's
# code. See docs/CONNECTOR_SDK.md.
id: stridewell
label: Stridewell (example)
kind: app

ui:
  label: Stridewell
  icon: activity            # from APP_ICONS in frontend/src/lib/appColor.tsx
  color: "#2ec27e"          # identity accent, used wherever this app appears
  section: apps
  order: 30
  embed: iframe             # Ava reverse-proxies the app's own UI same-origin
  url: "http://127.0.0.1:8481"

service:
  name: Stridewell
  probe: "http://127.0.0.1:8481/health"

# `discover` bridges the app's whole tool set live: Ava GETs /tools for the schemas
# and POSTs /call to invoke, so new tools need no per-tool wiring here.
actions:
  discover:
    base: "http://127.0.0.1:8481"
    list: "/tools"
    call: "/call"

# THE POINT OF THIS EXAMPLE. Dynamically-discovered tools have no static entry to
# infer a tier from, so the manifest classifies them by name pattern (fnmatch,
# first match wins). Without this block an unmatched tool on a non-device connector
# falls back to `write`, which would quietly treat "read my resting heart rate" as
# an ordinary mutation.
#
# Everything here defaults to `sensitive` rather than `read`, because resting heart
# rate, sleep and weight are health data — the tier is about what a disclosure
# costs, not about whether the call mutates anything. `log_*` is `write` because it
# changes the record, and Ava asks before a write the owner did not initiate.
dynamic_access:
  log_*: write
  "*": sensitive

# No `egress:` block is needed. A connector with a discovery/MCP facade reaches
# the agent through exactly two policed bridge routes — GET .../__tools and
# POST .../__call — and `ava connector policies` derives both from the `actions:
# discover:` block above. Spelling them out here as well is the obvious thing to
# write, and it used to render each rule TWICE in the generated policy.
