# Reference template. Copy this folder to  <id>/  and edit — or run:
#   ava connector new <id>
# (Folders starting with "_" are ignored by the loader.)
#
# Drop this folder into  $AVA_HOME/connectors/<id>/  and restart Ava. Nothing in
# Ava's core needs editing: the dashboard service row, perf source, agent egress
# policy, agent tools, AND the left-rail app tile are all DERIVED from this file.
# See docs/CONNECTOR_SDK.md for the full guide.
id: myapp
label: My App
kind: app                 # core | inference | media | app
enabled: true

# --- Health / monitoring ----------------------------------------------------
service:
  name: My App
  probe: "http://127.0.0.1:9000/health"   # optional HTTP health check
  # unit: myapp.service                     # optional systemd user unit
  # feature: image                          # optional features.* flag governing this
  #                                         #   service: off -> neutral "off", not red "down"

# --- Performance source (optional) ------------------------------------------
# perf:
#   app: myapp
#   path: "${AVA_LOGS}/apps/myapp/performance.jsonl"
#   # keep this OUTSIDE $AVA_HOME/connectors/<id> so Vitals history survives
#   # removing the connector (re-adding the same id resumes it)

# --- Left-rail app surface (optional) ---------------------------------------
# Declare `ui:` and your app appears in Ava's left rail. `embed` picks how the
# shell renders it. ${ENV_VAR} references resolve from Ava's environment/config.
# ui:
#   label: "My App"
#   icon: grid             # a key in frontend/src/lib/icons.tsx (unknown = no icon)
#   color: "#7c5cff"       # optional identity accent Ava shows wherever this app
#                          #   appears (sidebar dot, chat tool chips, cards).
#                          #   Omit for a stable auto color derived from the id.
#   section: apps          # rail group: core | apps  (default apps)
#   order: 50              # sort order within the section
#   embed: iframe          # native | iframe | none
#   # embed: native — a first-party React view compiled into Ava's bundle:
#   # view: myapp          #   registry key in frontend App.tsx NATIVE_VIEWS
#   # embed: iframe — your app serves its OWN web UI; Ava reverse-proxies it
#   #   same-origin under /apps/myapp/ so it inherits Ava's session cookie:
#   url: "http://127.0.0.1:9000"
#   # embed: none — no UI; Ava renders a generic action console from `actions`.
#   #
#   # Optional browser data-proxy: the native/iframe UI can call Ava at
#   # /apps/myapp/api/<path>, which Ava forwards to base+prefix+<path> with the
#   # bearer token injected server-side (the browser never sees the token):
#   api:
#     base: "http://127.0.0.1:9000"
#     prefix: "/api"
#     token_env: MYAPP_API_TOKEN

# --- Chat pickup (optional) ---------------------------------------------------
# After a turn used one of the named tools, Ava polls your app's log for
# artifacts produced during the turn and attaches them as chat quick-cards
# (deterministic — your app's log is the source of truth, no LLM parsing).
# App-relative artifact URLs are rewritten through the same-origin /apps/<id>
# proxy automatically for iframe apps.
# chat_pickup:
#   after_actions: [render]        # this connector's generated tools (myapp_render)
#   # after_tools: [my_raw_tool]   # optional extra raw tool names
#   path: "/api/log"               # GET base_url + path
#   params: { kind: render, limit: 12 }
#   list_key: log                  # JSON key holding rows (newest-first)
#   ts_key: ts                     # row field compared against the turn start
#   fields: { title: title, url: url, seed: seed }   # card fields <- row fields

# --- Live jobs (optional) -----------------------------------------------------
# Lets Ava's ops dashboard attribute GPU spikes to named tasks your app runs.
# jobs:
#   path: "/api/jobs"              # GET base_url + path; rows carry kind/stage/progress
#   params: { active: 1 }
#   list_key: jobs
#   engine: the GPU service                # shown next to the job name
#   labels:                        # kind -> human label (unknown kinds Title-Case)
#     render: "Content render"

# --- Model attribution (optional) ---------------------------------------------
# Label what a loaded model is FOR on the hardware dashboard.
# model_hints:
#   - { match: [mymodel], role: "Image rendering" }

# --- Agent egress (optional) ------------------------------------------------
# What Ava's sandboxed agent tools may reach for this connector. Rendered into
# an OpenClaw egress policy automatically (ava connector egress <id>).
# egress:
#   routes: ["POST /internal/connector/myapp/do_thing"]  # bridge routes
#   hosts:  ["127.0.0.1:9000"]                            # direct endpoints

# --- Agent actions (optional) -----------------------------------------------
# Two shapes are supported. LIST form (each becomes an agent tool that calls the
# generic proxy /internal/connector/myapp/<id>, forwarded to base_url+path):
# actions:
#   - id: do_thing
#     description: "Do the thing"
#     method: POST
#     path: "/api/do-thing"
#     input: { name: { type: string } }
#
# Or DICT form — mix static actions with DYNAMIC discovery. `discover` bridges a
# whole MCP-style tool set: Ava GETs `list` for the tool schemas and POSTs `call`
# with {name, arguments}. Great for wrapping an existing tool/MCP server.
# actions:
#   static:
#     - { id: do_thing, method: POST, path: "/api/do-thing" }
#   discover:
#     base: "http://127.0.0.1:9200"   # defaults to the connector base_url
#     list: "/tools"
#     call: "/call"
#     token_env: MYAPP_MCP_TOKEN

# --- MCP server (optional) ----------------------------------------------------
# Wrap ANY real Model Context Protocol server as this connector — its tools are
# discovered live and bridged to the agent behind an auto-generated egress
# policy. The sandboxed agent NEVER talks to the MCP server directly: it can
# reach only the two policed bridge routes (__tools / __call); the bridge
# speaks MCP (JSON-RPC over Streamable HTTP or stdio) server-side.
# mcp:
#   url: "http://127.0.0.1:9200/mcp"   # HTTP transport…
#   token_env: MYAPP_TOKEN              # optional bearer for the server
#   # …or a stdio server, spawned by the bridge on this machine (same trust
#   # model as any MCP desktop client — only add servers you trust):
#   # command: ["npx", "-y", "@modelcontextprotocol/server-github"]
#   # env: { GITHUB_TOKEN: "${GITHUB_TOKEN}" }
