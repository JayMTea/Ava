<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ava</title>
<style>
  /* Self-hosted Inter, same two files the app and the pre-auth pages use. This
     page is the no-bundle fallback (and /legacy), so it is what a fresh install
     sees before `npm run build` has ever run — it should not be the one screen
     in the product rendering in the OS default. Declared inline because this
     page carries its own token block rather than __BRAND_CSS__. */
  @font-face { font-family:"Inter Variable"; font-style:normal; font-display:swap;
               font-weight:100 900;
               src:url("/fonts/inter-latin-wght-normal.woff2") format("woff2-variations"); }
  :root { color-scheme: dark; --bg:#0b0d12; --panel:#161b26; --panel2:#1a1f2b;
          --line:#283047; --muted:#7b8394; --txt:#e7eaf0; --accent:#2a6df4; --rec:#e0364d;
          --font-ui:"Inter Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:var(--font-ui);
         background:var(--bg); color:var(--txt); height:100dvh; display:flex; flex-direction:column; }
  
  /* === LAYOUT STRUCTURE (NO SHIFT) ===
     - header (fixed height)
     - #viewPort (flex:1) ← the chat log
     - #composer (fixed height)
     There used to be a second view here (the Learning dashboard) and a nav to
     swap between them; both went with the Learning feature. */
  header { padding:14px 16px 10px; text-align:center; border-bottom:1px solid var(--line); position:relative; flex:0 0 auto; }
  header h1 { margin:0; font-size:20px; letter-spacing:.3px; }
  header .sub { font-size:12px; color:var(--muted); margin-top:3px; }
  
  /* View container: each view fills remaining space (flex:1); switching views doesn't shift layout */
  #viewPort { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .view { position:absolute; inset:0; display:none !important; flex-direction:column; overflow-y:auto; }
  .view.active { display:flex !important; }
  
  #log { padding:14px; gap:10px; }
  #studioView { padding:14px; }
  .bubble { max-width:82%; padding:10px 13px; border-radius:16px; font-size:16px; line-height:1.4;
            white-space:pre-wrap; word-wrap:break-word; }
  .me  { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
  .ava { align-self:flex-start; background:var(--panel2); border-bottom-left-radius:5px; }
  .sys { align-self:center; background:transparent; color:var(--muted); font-size:13px; }
  .me .atts { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .me .atts img { width:120px; height:120px; object-fit:cover; border-radius:10px; display:block; }
  .me .filepill { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.18);
                  border-radius:10px; padding:6px 10px; font-size:13px; }
  /* Which-model pill under an Ava reply. */
  .modelpill { display:inline-flex; align-items:center; gap:6px; margin-top:7px;
    font-size:11px; line-height:1; color:#8b93a6; background:rgba(255,255,255,.03);
    border:1px solid #2a3142; border-radius:999px; padding:4px 9px; user-select:none; }
  .modelpill .dot { width:7px; height:7px; border-radius:50%; flex:0 0 auto;
    background:#3fb27f; box-shadow:0 0 0 2px rgba(63,178,127,.18); }
  /* Footer row under an Ava reply: model pill + Claude-style Copy / Retry actions. */
  .avafoot { display:flex; align-items:center; flex-wrap:wrap; gap:2px; margin-top:6px; }
  .avafoot .modelpill { margin-top:0; margin-right:6px; }
  .msgfoot { display:flex; align-items:center; flex-wrap:wrap; gap:2px; margin-top:6px; }
  .msgact { display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-size:11.5px; line-height:1; color:#8b93a6; background:transparent; border:none;
    border-radius:7px; padding:5px 7px; cursor:pointer; transition:opacity .12s, background .12s, color .12s;
    opacity:0; }
  .bubble:hover .msgact { opacity:1; }
  .msgact:hover:not(:disabled){ color:#e6e9f0; background:rgba(255,255,255,.06); }
  .msgact:disabled { opacity:.6; cursor:default; }
  .msgact svg { width:15px; height:15px; flex:0 0 auto; }
  .msgact.copied { color:#3fb27f; }
  /* Inline action buttons (code-mode apply / discard). */
  .actbtn { display:inline-flex; align-items:center; gap:6px; font-size:12px;
    color:#aab2c2; background:var(--panel2); border:1px solid #2a3142;
    border-radius:10px; padding:5px 10px; cursor:pointer; }
  .actbtn:hover:not(:disabled){ color:#e6e9f0; border-color:#3a435a; }
  .actbtn:disabled { opacity:.7; cursor:default; }
  .actbtn svg { width:14px; height:14px; flex:0 0 auto; }
  .actbtn.primary { color:#dfe9ff; background:#23304d; border-color:#33457a; }
  .actbtn.primary:hover:not(:disabled){ border-color:#4a63a8; }
  .actbtn.done { color:#7fe0a6; border-color:#2c5a3f; background:#16261d; }
  /* Live chain-of-thought panel (Ava's real reasoning + tool steps, collapsible). */
  .cot { align-self:flex-start; background:var(--panel2); border:1px solid var(--line);
         border-radius:14px; max-width:88%; overflow:hidden; }
  .cot-head { display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer;
              font-size:13px; color:#aab2c2; user-select:none; }
  .cot-spin { width:13px; height:13px; flex:0 0 auto; border-radius:50%;
              border:2px solid #333a49; border-top-color:var(--accent); animation:cotspin .8s linear infinite; }
  @keyframes cotspin { to { transform:rotate(360deg); } }
  .cot-done .cot-spin, .cot-fail .cot-spin { display:none; }
  .cot-fail .cot-lab { color:#e0697d; }
  .cot-lab { flex:1; min-width:0; }
  .cot-body { display:none; flex-direction:column; gap:7px; padding:2px 12px 11px; }
  .cot.open .cot-body { display:flex; }
  .cstep { font-size:12.5px; line-height:1.45; padding-left:10px; border-left:2px solid #2a3142;
           white-space:pre-wrap; word-break:break-word; }
  .cstep.think { color:#8b93a5; font-style:italic; }
  .cstep.say { color:#c7cdda; }
  .cstep.tool { color:var(--accent); border-left-color:var(--accent); display:flex; align-items:center; gap:6px; }
  .cstep.tool svg { width:14px; height:14px; flex:0 0 auto; }
  .bubble.me.failed { outline:1px solid #6b2b39; }
  .retry-hint { margin-top:6px; font-size:11.5px; color:#ff8a9b; display:flex; align-items:center; gap:5px; }
  .retry-hint svg { width:14px; height:14px; flex:0 0 auto; }

  /* OpenClaw-style composer pinned to the bottom: attach | input | mic | send */
  #composer { padding:8px 10px calc(10px + env(safe-area-inset-bottom));
              border-top:1px solid var(--line); background:var(--bg); }
  #chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 2px 8px; }
  #chips:empty { display:none; }
  .chip { display:flex; align-items:center; gap:8px; background:var(--panel);
          border:1px solid var(--line); border-radius:12px; padding:6px 8px; max-width:230px; }
  .chip img { width:34px; height:34px; object-fit:cover; border-radius:8px; }
  .chip .ic { width:34px; height:34px; display:flex; align-items:center; justify-content:center;
              background:var(--panel2); border-radius:8px; font-size:18px; }
  .chip .meta { display:flex; flex-direction:column; min-width:0; }
  .chip .nm { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip .sz { font-size:11px; color:var(--muted); }
  .chip .x { margin-left:2px; color:var(--muted); font-size:18px; line-height:1; cursor:pointer;
             background:none; border:none; padding:0 2px; }
  .crow { display:flex; align-items:flex-end; gap:6px; background:var(--panel);
          border:1px solid var(--line); border-radius:24px; padding:5px 6px; }
  #text { flex:1; background:transparent; border:none; color:var(--txt); resize:none;
          font-size:16px; line-height:1.35; padding:8px 6px; max-height:140px; outline:none; }
  .ibtn { flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
          font-size:18px; display:flex; align-items:center; justify-content:center;
          background:transparent; color:var(--txt); transition:transform .08s, background .15s; }
  .ibtn:active { transform:scale(.92); }
  #attach { color:var(--muted); }
  .mic { background:var(--panel2); color:var(--txt); touch-action:none; user-select:none; }
  .mic.rec { background:var(--rec); box-shadow:0 0 0 6px rgba(224,54,77,.18); }
  .send { background:var(--accent); color:#fff; }
  .ibtn.busy { background:#555c6b; }
  .hint { font-size:12px; color:var(--muted); min-height:15px; padding:6px 8px 0; text-align:center; }

  /* Chat-history drawer (expand button top-left, like ChatGPT/Claude). */
  #menuBtn { position:absolute; left:8px; top:11px; width:38px; height:38px; border:none;
             background:transparent; color:var(--txt); font-size:21px; cursor:pointer;
             display:flex; align-items:center; justify-content:center; border-radius:10px; }
  #menuBtn:active { background:var(--panel); }
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none;
           transition:opacity .2s; z-index:18; }
  #scrim.open { opacity:1; pointer-events:auto; }
  #drawer { position:fixed; top:0; left:0; height:100dvh; width:84%; max-width:340px; z-index:19;
            background:var(--panel); border-right:1px solid var(--line); transform:translateX(-100%);
            transition:transform .22s ease; display:flex; flex-direction:column;
            padding-top:env(safe-area-inset-top); }
  #drawer.open { transform:translateX(0); }
  .draw-head { padding:14px 14px 10px; border-bottom:1px solid var(--line); display:flex;
               align-items:center; justify-content:space-between; }
  .draw-head span { font-size:16px; font-weight:600; }
  #newChat { display:flex; align-items:center; gap:8px; margin:10px; padding:12px;
             background:var(--panel2); border:1px solid var(--line); border-radius:12px;
             color:var(--txt); font-size:15px; cursor:pointer; }
  #newChat:active { background:#222838; }
  #chatList { flex:1; overflow-y:auto; padding:2px 8px 16px; display:flex; flex-direction:column; gap:2px; }
  .chatitem { display:flex; align-items:center; gap:6px; padding:10px; border-radius:10px; cursor:pointer; }
  .chatitem:active, .chatitem.active { background:var(--panel2); }
  .chatitem .ci-main { flex:1; min-width:0; }
  .chatitem .ci-title { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chatitem .ci-time { font-size:11px; color:var(--muted); margin-top:1px; }
  .chatitem .del { flex:0 0 auto; width:32px; height:32px; border:none; background:transparent;
                   color:var(--muted); font-size:15px; border-radius:8px; cursor:pointer;
                   display:flex; align-items:center; justify-content:center; }
  .chatitem .del:active { background:#3a2330; color:#ff6b81; }
  .draw-empty { color:var(--muted); font-size:13px; text-align:center; padding:26px 16px; }

  /* App launcher (sidebar) — Ava is the home app; other pages (Studio…) live here. */
  /* Inline icons — every glyph is a clean, standardized line icon (currentColor). */
  .ibtn svg { width:21px; height:21px; pointer-events:none; }
  #menuBtn svg { width:22px; height:22px; pointer-events:none; }
  #newChat svg { width:19px; height:19px; flex:0 0 auto; }
  .me .filepill svg { width:17px; height:17px; flex:0 0 auto; }
  .chip .ic svg { width:19px; height:19px; }
  .chip .x svg { width:16px; height:16px; pointer-events:none; }
  .chatitem .del svg { width:17px; height:17px; pointer-events:none; }
  .sys .sysicon { display:inline-flex; vertical-align:-3px; margin-right:5px; }
  .sys .sysicon svg { width:15px; height:15px; }

  /* --- nav toggle --- */
  #nav { display:inline-flex; gap:2px; margin-top:8px; background:var(--panel);
         border:1px solid var(--line); border-radius:12px; padding:3px; }
  .navbtn { border:none; background:transparent; color:var(--muted); font-size:13px;
            font-weight:600; padding:6px 18px; border-radius:9px; cursor:pointer; }
  .navbtn.active { background:var(--accent); color:#fff; }
  #studioView { flex:1; overflow-y:auto; padding:14px; }
  .st-wrap { display:flex; flex-direction:column; gap:14px; max-width:760px; margin:0 auto; }
  .st-card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .st-h { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; margin-bottom:12px; }
  .st-badge { background:var(--panel2); color:var(--muted); font-size:12px; border-radius:10px; padding:1px 8px; }
  .st-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .st-row select, .st-row input, .st-card select, .st-card input, .st-card textarea {
    background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:8px 10px; font-size:14px; font-family:inherit; }
  #stCount { width:72px; }
  .st-btn { border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:13px;
            font-weight:600; cursor:pointer; background:var(--panel2); color:var(--txt); }
  .st-btn.primary { background:var(--accent); color:#fff; border-color:transparent; }
  .st-btn.ghost { background:transparent; }
  .st-btn.danger { color:#ff6b81; }
  .st-btn:disabled { opacity:.6; cursor:default; }
  .st-status { font-size:13px; color:var(--muted); white-space:pre-wrap; }
  .st-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .st-grid:empty::after { content:"nothing here yet"; color:var(--muted); font-size:13px; }
  .st-tile { background:var(--panel2); border:1px solid var(--line); border-radius:12px;
             overflow:hidden; display:flex; flex-direction:column; }
  .st-tile img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; cursor:zoom-in; }
  .st-tile .st-meta { font-size:11px; color:var(--muted); padding:6px 8px 0; }
  .st-tile .st-models { display:flex; flex-wrap:wrap; gap:3px; padding:4px 8px 0; }
  .st-tile .st-mtag { font-size:10px; color:var(--muted); border:1px solid var(--line);
    border-radius:6px; padding:1px 5px; white-space:nowrap; }
  .st-tile .st-mtag b { color:var(--accent); font-weight:700; margin-right:3px; }
  .st-tile textarea { margin:6px 8px; height:54px; font-size:12px; resize:vertical; }
  .st-tile .st-acts, .st-sched { display:flex; flex-wrap:wrap; gap:4px; padding:0 8px 8px; }
  .st-tile .st-acts .st-btn { padding:6px 8px; font-size:12px; flex:1; min-width:54px; }
  .st-sched input { flex:1; font-size:11px; padding:5px; min-width:0; }
  .subnav { display:inline-flex; gap:2px; background:var(--panel); border:1px solid var(--line);
            border-radius:11px; padding:3px; align-self:center; }
  .subbtn { border:none; background:transparent; color:var(--muted); font-size:13px; font-weight:600;
            padding:6px 16px; border-radius:8px; cursor:pointer; }
  .subbtn.active { background:var(--accent); color:#fff; }
  .st-lbl { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .st-chk { font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:5px; }
  .st-attrs { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin:2px 0; }
  .st-attrs .af { display:flex; flex-direction:column; gap:3px; }
  .st-attrs .af span { font-size:11px; color:var(--muted); }
  .st-attrs .af select { width:100%; }
  .st-stage { border-top:1px solid var(--line); margin-top:14px; padding-top:12px; }
  .st-stage:first-of-type { border-top:none; margin-top:4px; padding-top:0; }
  .st-stage-h { font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase;
                letter-spacing:.05em; margin-bottom:8px; }
  .st-hint { font-size:12px; color:var(--muted); margin-top:6px; }

  /* Bottom toast notifications */
  #avaToasts { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center;
    pointer-events:none; width:max-content; max-width:min(92vw,440px); }
  .ava-toast { pointer-events:auto; padding:10px 14px; border-radius:9px; font-size:12.5px;
    line-height:1.4; box-shadow:0 6px 22px rgba(0,0,0,.45); border:1px solid #2a3142;
    background:#161b26; color:#dfe5ef; display:flex; align-items:flex-start; gap:9px;
    opacity:0; transform:translateY(8px); transition:opacity .18s, transform .18s; }
  .ava-toast.show { opacity:1; transform:translateY(0); }
  .ava-toast.ok { border-color:#2e5a43; }
  .ava-toast.ok .ava-toast-ico { color:#3fb27f; }
  .ava-toast.err { border-color:#5a2e34; }
  .ava-toast.err .ava-toast-ico { color:#ff8fa0; }
  .ava-toast.info .ava-toast-ico { color:var(--accent); }
  .ava-toast-ico { flex:0 0 auto; margin-top:1px; }

  /* === ARTIFACT SPLIT PANEL (Claude-style side canvas, resizable) === */
  #appShell { flex:1 1 auto; display:flex; flex-direction:row; min-height:0; overflow:hidden; }
  #appCol { flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0; height:100%; }
  #artifactDivider { display:none; flex:0 0 8px; cursor:col-resize; align-items:center;
    justify-content:center; background:var(--bg); border-left:1px solid var(--line);
    border-right:1px solid var(--line); }
  #artifactDivider .art-grip { width:3px; height:44px; border-radius:3px; background:#39425c; }
  #artifactDivider:hover .art-grip { background:var(--accent); }
  #artifactPanel { flex:0 0 var(--art-w, 44%); min-width:0; display:none; flex-direction:column;
    background:var(--panel); border-left:1px solid var(--line); overflow:hidden; }
  #appShell.art-open #artifactDivider { display:flex; }
  #appShell.art-open #artifactPanel { display:flex; }
  .art-head { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:11px 14px; border-bottom:1px solid var(--line); background:var(--panel2); }
  .art-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600;
    min-width:0; }
  .art-title span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .art-ic { display:inline-flex; width:20px; height:20px; color:var(--accent); flex:0 0 auto; }
  .art-ic svg { width:20px; height:20px; }
  .art-tools { display:flex; gap:4px; flex:0 0 auto; }
  .art-ibtn { width:32px; height:32px; border:none; border-radius:9px; cursor:pointer;
    background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .art-ibtn:hover { background:rgba(255,255,255,.06); color:var(--txt); }
  .art-ibtn svg { width:18px; height:18px; }
  .art-body { flex:1 1 auto; overflow-y:auto; padding:16px; }
  .art-foot { flex:0 0 auto; padding:8px 14px; border-top:1px solid var(--line);
    font-size:11px; color:var(--muted); }

  /* Small "open artifact" chip shown under an Ava reply that produced one. */
  .art-chip { display:inline-flex; align-items:center; gap:7px; margin-top:8px; cursor:pointer;
    font-size:12.5px; color:#cfe0ff; background:rgba(42,109,244,.12); border:1px solid #2c447f;
    border-radius:12px; padding:8px 12px; transition:background .12s, border-color .12s; }
  .art-chip:hover { background:rgba(42,109,244,.2); border-color:var(--accent); }
  .art-chip b { font-weight:600; }
  .art-chip small { color:var(--muted); }

  /* --- Weather artifact --- */
  .wx { display:flex; flex-direction:column; gap:16px; }
  .wx-hero { display:flex; align-items:center; gap:16px; padding:16px 18px; border-radius:16px;
    background:linear-gradient(135deg,#1c2740,#141a28); border:1px solid var(--line); }
  .wx-hero-main { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .wx-temp { font-size:40px; font-weight:700; line-height:1; }
  .wx-desc { font-size:14px; color:#cdd4e2; }
  .wx-loc { font-size:12.5px; color:var(--muted); }
  .wx-stats { display:flex; gap:14px; margin-left:auto; flex-wrap:wrap; }
  .wx-stat { text-align:center; }
  .wx-stat .v { font-size:15px; font-weight:600; }
  .wx-stat .k { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .wx-section-h { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase;
    letter-spacing:.5px; margin:2px 2px 6px; }
  .wx-chart { width:100%; border-radius:14px; background:var(--panel2); border:1px solid var(--line);
    padding:8px 4px 4px; }
  .wx-chart svg { width:100%; height:auto; display:block; }
  .wx-days { display:flex; flex-direction:column; gap:6px; }
  .wx-day { display:grid; grid-template-columns:52px 1fr 96px; align-items:center; gap:10px;
    padding:9px 12px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); }
  .wx-day .d { font-size:13px; font-weight:600; }
  .wx-day .cond { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wx-day .rng { display:flex; align-items:center; gap:8px; justify-content:flex-end; font-size:13px; }
  .wx-day .rng .lo { color:#6ea8ff; }
  .wx-day .rng .hi { color:#ffb454; font-weight:600; }

  // Bottom toast notifications. type: 'info' | 'ok' | 'err'. Sticky toasts
  // (duration<=0) stay until dismissed via the returned handle.
  function avaToast(msg, type, duration){
    const wrap = document.getElementById('avaToasts');
    if (!wrap) return { update(){}, dismiss(){} };
    const el = document.createElement('div');
    el.className = 'ava-toast ' + (type||'info');
    const ico = document.createElement('span');
    ico.className = 'ava-toast-ico';
    ico.textContent = type==='ok' ? '\u2713' : (type==='err' ? '\u26a0' : '\u2139');
    const txt = document.createElement('span');
    txt.textContent = msg;
    el.appendChild(ico); el.appendChild(txt);
    wrap.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    let timer = null;
    const dismiss = () => {
      if (!el.parentNode) return;
      el.classList.remove('show');
      setTimeout(() => el.remove(), 220);
    };
    const schedule = (d) => { if (d && d>0){ clearTimeout(timer); timer = setTimeout(dismiss, d); } };
    schedule(duration===undefined ? 3600 : duration);
    return {
      update(m, t, d){
        txt.textContent = m;
        if (t){ el.className = 'ava-toast show ' + t;
          ico.textContent = t==='ok' ? '\u2713' : (t==='err' ? '\u26a0' : '\u2139'); }
        schedule(d);
      },
      dismiss,
    };
  }

  // Poll /api/health until the bridge answers again (used after applying a
  // change that restarts the service, e.g. a protected .py edit).
  async function waitForBridge(maxMs){
    const deadline = Date.now() + (maxMs || 25000);
    await new Promise(r => setTimeout(r, 1400)); // let it actually go down first
    while (Date.now() < deadline){
      try{
        const r = await fetch('/api/health', { cache:'no-store' });
        if (r.ok){ const j = await r.json().catch(()=>({})); if (j.ok !== false) return true; }
      }catch(_){}
      await new Promise(r => setTimeout(r, 800));
    }
    return false;
  }

function renderWeather(root, art){
  const wrap = document.createElement('div'); wrap.className = 'wx';

    '</div>' +
    '<div class="wx-stats">' +
      (c.feels != null ? statBlock('Feels', c.feels + u) : '') +
      (c.humidity != null ? statBlock('Humidity', c.humidity + '%') : '') +
      (c.wind != null ? statBlock('Wind', c.wind + ' ' + ((art.units&&art.units.wind)||'mph')) : '') +
    '</div>';
  wrap.appendChild(hero);
  const days = art.daily || [];
  if (days.length){
    const h1 = document.createElement('div'); h1.className = 'wx-section-h'; h1.textContent = 'Temperature this week';
    wrap.appendChild(h1);
    const ch = document.createElement('div'); ch.className = 'wx-chart';
    ch.innerHTML = weatherChartSVG(days, u);
    wrap.appendChild(ch);
    const h2 = document.createElement('div'); h2.className = 'wx-section-h'; h2.textContent = 'Daily forecast';
    wrap.appendChild(h2);
    const list = document.createElement('div'); list.className = 'wx-days';

        '<div class="d">' + d.weekday + '</div>' +

          '<span class="lo">' + (d.tmin != null ? d.tmin + '\u00b0' : '') + '</span>' +
          '<span class="hi">' + (d.tmax != null ? d.tmax + '\u00b0' : '') + '</span></div>';

function statBlock(k, v){ return '<div class="wx-stat"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }

// Inline SVG line chart: high (amber) + low (blue) with area fill + precip bars.
function weatherChartSVG(days, u){
  const W = 520, H = 200, padL = 30, padR = 14, padT = 18, padB = 40;
  const n = days.length;
  const highs = days.map(d => d.tmax).filter(v => v != null);
  const lows = days.map(d => d.tmin).filter(v => v != null);
  const allT = highs.concat(lows);
  if (!allT.length) return '';
  let mn = Math.min.apply(null, allT), mx = Math.max.apply(null, allT);
  const span = Math.max(mx - mn, 6); mn -= span * 0.15; mx += span * 0.18;
  const x = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const y = t => padT + (mx - t) * (H - padT - padB) / (mx - mn);
  const pts = arr => arr.map((v, i) => x(i) + ',' + y(v)).join(' ');
  const hi = days.map(d => d.tmax), lo = days.map(d => d.tmin);
  let bars = '';
  const bw = Math.min(26, (W - padL - padR) / n * 0.5);
  days.forEach((d, i) => {
    if (d.precip == null || d.precip <= 0) return;
    const bh = (d.precip / 100) * (H - padT - padB);
    bars += '<rect x="' + (x(i) - bw / 2) + '" y="' + (H - padB - bh) + '" width="' + bw +
      '" height="' + bh + '" rx="3" fill="#6ea8ff" opacity="0.14"></rect>';
  });
  let grid = '';
  for (let g = 0; g <= 2; g++){
    const tv = mn + (mx - mn) * g / 2;
    const gy = y(tv);
    grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy +
      '" stroke="#283047" stroke-width="1"></line>' +
      '<text x="' + (padL - 6) + '" y="' + (gy + 3) + '" text-anchor="end" font-size="9" fill="#7b8394">' +
      Math.round(tv) + '</text>';
  }
  const area = 'M ' + hi.map((v, i) => x(i) + ' ' + y(v)).join(' L ') + ' L ' +
    lo.map((v, i) => x(i) + ' ' + y(v)).reverse().join(' L ') + ' Z';
  let labels = '', dots = '';
  days.forEach((d, i) => {
    labels += '<text x="' + x(i) + '" y="' + (H - padB + 16) + '" text-anchor="middle" font-size="10" fill="#aab2c2">' +
      (d.weekday === 'Today' ? 'Today' : d.weekday) + '</text>';
    if (d.tmax != null){ dots += '<circle cx="' + x(i) + '" cy="' + y(d.tmax) + '" r="3" fill="#ffb454"></circle>' +
      '<text x="' + x(i) + '" y="' + (y(d.tmax) - 7) + '" text-anchor="middle" font-size="9.5" fill="#ffb454">' + d.tmax + '\u00b0</text>'; }
    if (d.tmin != null){ dots += '<circle cx="' + x(i) + '" cy="' + y(d.tmin) + '" r="3" fill="#6ea8ff"></circle>' +
      '<text x="' + x(i) + '" y="' + (y(d.tmin) + 15) + '" text-anchor="middle" font-size="9.5" fill="#6ea8ff">' + d.tmin + '\u00b0</text>'; }
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="week temperature chart">' +
    grid + bars +
    '<path d="' + area + '" fill="#ffb454" opacity="0.06"></path>' +
    '<polyline points="' + pts(hi) + '" fill="none" stroke="#ffb454" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
    '<polyline points="' + pts(lo) + '" fill="none" stroke="#6ea8ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
    dots + labels + '</svg>';
}

    busy = true; statusEl.textContent = 'thinking\u2026';
    const c = cid || await ensureChat();
    await submit(t, (atts || []), c, null);
    busy = false; statusEl.textContent = 'hold the mic to talk';
    rb.disabled = false; loadChats();
  };
  foot.appendChild(rb);
  bubble.appendChild(foot);
  log.scrollTop = log.scrollHeight;
}

// Clipboard with a fallback for browsers that block the async API.
async function copyText(s){
  try{
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(s); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea'); ta.value = s;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.focus(); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

// A user message that may carry uploaded attachments (image thumbs + file pills).
function addMe(text, atts){
  const d = document.createElement('div');
  d.className = 'bubble me';
  if (atts && atts.length){
    const wrap = document.createElement('div'); wrap.className='atts';
    atts.forEach(a => {
      if (a.kind==='image' && a.url){ const im=document.createElement('img'); im.src=a.url; wrap.appendChild(im); }
      else { const p=document.createElement('div'); p.className='filepill'; p.innerHTML=ICONS.file;
             const s=document.createElement('span'); s.textContent=a.filename; p.appendChild(s); wrap.appendChild(p); }
    });
    d.appendChild(wrap);
  }
  if (text){ const tx=document.createElement('div'); tx.textContent=text; d.appendChild(tx); }
  // Add copy/retry buttons to user messages
  if (text) addMessageActions(d, text, atts);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

// Add copy/retry action buttons to any message (user or assistant).
function addMessageActions(bubble, text, atts){
  if (!bubble || !text) return;
  const foot = document.createElement('div'); foot.className = 'msgfoot';
  const cb = document.createElement('button'); cb.type = 'button'; cb.className = 'msgact';
  cb.title = 'Copy';
  cb.innerHTML = ICONS.copy + '<span>Copy</span>';
  cb.onclick = async () => {
    const ok = await copyText(text || '');
    if (!ok) return;
    cb.classList.add('copied');
    cb.innerHTML = ICONS.check + '<span>Copied</span>';
    setTimeout(() => { cb.classList.remove('copied'); cb.innerHTML = ICONS.copy + '<span>Copy</span>'; }, 1600);
  };
  foot.appendChild(cb);
  const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'msgact';
  rb.title = 'Resend this message';
  rb.innerHTML = ICONS.refresh + '<span>Retry</span>';
  rb.onclick = async () => {
    if (busy) return;
    rb.disabled = true;
    busy = true; statusEl.textContent = 'thinking\u2026';
    const c = currentChatId || await ensureChat();
    await submit(text, (atts || []), c, null);
    busy = false; statusEl.textContent = 'hold the mic to talk';
    rb.disabled = false; loadChats();
  };
  foot.appendChild(rb);
  bubble.appendChild(foot);
  log.scrollTop = log.scrollHeight;
}

// Live "chain of thought": the agent CLI isn't streamable and the model only
// supports thinking=off, but it writes genuine {thinking}/{text}/{toolCall} steps
// to its session log as it works — the backend tails that and exposes it via
// /api/turn/{id}, which we poll here and render live, then collapse when done.
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function addCot(label){
  const box = document.createElement('div'); box.className = 'cot open';
  const head = document.createElement('div'); head.className = 'cot-head';
  head.innerHTML = '<span class="cot-spin"></span><span class="cot-lab">'+label+'\u2026</span>';
  const body = document.createElement('div'); body.className = 'cot-body';
  box.appendChild(head); box.appendChild(body);
  head.onclick = () => box.classList.toggle('open');
  log.appendChild(box); log.scrollTop = log.scrollHeight;
  const lab = head.querySelector('.cot-lab');
  let nsteps = 0;
  const render = (steps) => {
    nsteps = steps.length; body.innerHTML = '';
    steps.forEach(s => {
      const d = document.createElement('div');
      if (s.kind === 'tool'){ d.className = 'cstep tool'; d.innerHTML = ICONS.image + '<span></span>'; d.querySelector('span').textContent = 'Using ' + (s.name||'tool').replace(/^.*__/, '').replace(/_/g,' '); }
      else if (s.kind === 'thinking'){ d.className = 'cstep think'; d.textContent = s.text; }
      else { d.className = 'cstep say'; d.textContent = s.text; }
      body.appendChild(d);
    });
    if (box.classList.contains('open')) log.scrollTop = log.scrollHeight;
  };
  return {
    el: box,
    update(steps){ if (steps && steps.length) render(steps); },
    done(secs){ box.classList.remove('open'); box.classList.add('cot-done');
      lab.textContent = 'Thought for ' + secs + 's' + (nsteps ? (' \u00b7 ' + nsteps + ' steps') : ''); },
    fail(msg){ box.classList.remove('open'); box.classList.add('cot-fail');
      lab.textContent = 'Failed: ' + msg; }
  };
}

function clearRetry(b){ if(!b) return; b.classList.remove('failed'); b.onclick=null; b.style.cursor='';
  const h=b.querySelector('.retry-hint'); if(h) h.remove(); }

// Tap a failed user message to re-send the exact same query + attachments.
function markRetry(meBubble, t, atts){
  if (!meBubble || meBubble.querySelector('.retry-hint')) return;
  meBubble.classList.add('failed'); meBubble.style.cursor='pointer';
  const h = document.createElement('div'); h.className='retry-hint';
  h.innerHTML = ICONS.alert + '<span>Failed \u00b7 tap to retry</span>'; meBubble.appendChild(h);
  meBubble.onclick = async () => {
    if (busy) return;
    clearRetry(meBubble);
    busy = true; statusEl.textContent='thinking\u2026';
    const cid = await ensureChat();
    await submit(t, atts, cid, meBubble);
    busy = false; statusEl.textContent='hold the mic to talk'; loadChats();
  };
}

async function runAvaTurn(t, atts, cid, meBubble){
  const cot = addCot(atts.length ? 'Ava is reading & thinking' : 'Ava is thinking');
  const t0 = Date.now();
  try{
    const fd = new FormData(); fd.append('text', t);
    fd.append('history', JSON.stringify(history.slice(0,-1)));
    fd.append('attachments', JSON.stringify(atts.map(a=>a.id)));
    fd.append('chat_id', cid);
    const r = await fetch('/api/chat-stream', { method:'POST', body: fd });
    const j = await r.json();
    if (!j.turn_id){ cot.fail(j.error||'could not start'); markRetry(meBubble, t, atts); return; }
    while (true){
      await sleep(750);
      let s;
      try{ const rr = await fetch('/api/turn/' + j.turn_id); s = await rr.json(); }
      catch(e){ continue; }
      if (s.steps) cot.update(s.steps);
      if (s.status === 'done'){
        cot.done(Math.round((Date.now()-t0)/1000));
        if (s.reply){ const ab = add('ava', s.reply); addAvaActions(ab, s.model, s.reply, t, atts, cid); if (s.artifact){ addArtifactChip(ab, s.artifact); } history.push({role:'assistant', content:s.reply}); history = history.slice(-12); }
        if (s.artifact){ openArtifact(s.artifact); }
        return;
      }
      if (s.status === 'error'){ cot.fail(s.error||'failed'); markRetry(meBubble, t, atts); return; }
      if (!s.status && s.error){ cot.fail(s.error); markRetry(meBubble, t, atts); return; }
    }
  }catch(e){ cot.fail('network error'); markRetry(meBubble, t, atts); }
}

// ---- attachments ----------------------------------------------------------
function renderChips(){
  chipsEl.innerHTML='';
  pending.forEach(a => {
    const c=document.createElement('div'); c.className='chip';
    if (a.kind==='image' && a.url){ const im=document.createElement('img'); im.src=a.url; c.appendChild(im); }
    else { const ic=document.createElement('div'); ic.className='ic'; ic.innerHTML=ICONS.file; c.appendChild(ic); }
    const meta=document.createElement('div'); meta.className='meta';
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=a.filename;
    const sz=document.createElement('div'); sz.className='sz';
    sz.textContent = a.kind==='image' ? (a.ocr ? 'image \u00b7 text read' : 'image') : ((a.chars||0)+' chars');
    meta.appendChild(nm); meta.appendChild(sz); c.appendChild(meta);
    const x=document.createElement('button'); x.className='x'; x.innerHTML=ICONS.close; x.title='Remove attachment';
    x.onclick=()=>{ pending=pending.filter(p=>p.id!==a.id); renderChips(); };
    c.appendChild(x); chipsEl.appendChild(c);
  });
}

async function uploadFiles(fileList){
  const files=[...fileList]; if(!files.length) return;
  const fd=new FormData(); files.forEach(f=>fd.append('files', f, f.name));
  hint.textContent='uploading\u2026';
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    const j=await r.json();
    (j.attachments||[]).forEach(a=>{ if(a.error){ addSys(a.error,'alert'); } else { pending.push(a); } });
    renderChips(); hint.textContent='';
  }catch(e){ hint.textContent=''; addSys('upload failed: '+e.message,'alert'); }
  fileEl.value='';
}

// ---- chat history (ChatGPT/Claude-style sidebar) --------------------------
function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); loadChats(); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }

function relTime(ts){
  if(!ts) return '';
  const s = Math.max(0, Date.now()/1000 - ts);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60)+'m ago';
  if (s < 86400) return Math.floor(s/3600)+'h ago';
  if (s < 604800) return Math.floor(s/86400)+'d ago';
  return new Date(ts*1000).toLocaleDateString();
}

async function loadChats(){
  try{ const r = await fetch('/api/chats'); const j = await r.json(); renderChatList(j.chats||[]); }
  catch(e){}
}

function renderChatList(items){
  chatListEl.innerHTML='';
  if(!items.length){ const e=document.createElement('div'); e.className='draw-empty';
    e.textContent='No chats yet. Start a new one.'; chatListEl.appendChild(e); return; }
  items.forEach(it => {
    const row=document.createElement('div'); row.className='chatitem'+(it.id===currentChatId?' active':'');
    const main=document.createElement('div'); main.className='ci-main';
    const tt=document.createElement('div'); tt.className='ci-title'; tt.textContent=it.title||'New chat';
    const tm=document.createElement('div'); tm.className='ci-time'; tm.textContent=relTime(it.updated);
    main.appendChild(tt); main.appendChild(tm);
    main.onclick=()=>openChat(it.id);
    const del=document.createElement('button'); del.className='del'; del.innerHTML=ICONS.trash;
    del.title='Delete chat';
    del.onclick=(ev)=>{ ev.stopPropagation(); deleteChat(it.id); };
    row.appendChild(main); row.appendChild(del); chatListEl.appendChild(row);
  });
}

function renderMessages(msgs){
  log.innerHTML='';
  let lastUserText = '';
  (msgs||[]).forEach(m => {
    if (m.role==='user'){ 
      lastUserText = m.content || '';
      addMe(m.content||'', m.atts||[]); 
    }
    else {
      const bubble = add('ava', m.content||'');
      // Add copy/retry actions to historical Ava messages
      // Pass lastUserText as the retry prompt, not the timestamp
      addAvaActions(bubble, m.model||null, m.content||'', lastUserText, m.atts||[], currentChatId);
    }
  });
}

async function openChat(id){
  try{
    const r = await fetch('/api/chats/'+id); const j = await r.json();
    if (j.error){ return; }
    currentChatId = id; localStorage.setItem('ava.chat', id);
    history = []; renderMessages(j.messages);
    if(!(j.messages||[]).length){
      add('sys','New chat. Hold the mic to talk, type a message, or attach a file.'); }
    closeDrawer();
  }catch(e){}
}

async function newChat(){
  try{
    const r = await fetch('/api/chats', {method:'POST'}); const c = await r.json();
    currentChatId = c.id; localStorage.setItem('ava.chat', c.id);
    history = []; log.innerHTML='';
    add('sys','New chat. Hold the mic to talk, type a message, or attach a file.');
    closeDrawer(); loadChats();
  }catch(e){}
}

async function deleteChat(id){
  if(!confirm('Delete this chat? This cannot be undone.')) return;
  try{
    await fetch('/api/chats/'+id, {method:'DELETE'});
    if (id===currentChatId){ currentChatId=null; localStorage.removeItem('ava.chat'); }
    await loadChats();
    if (!currentChatId){
      const r = await fetch('/api/chats'); const j = await r.json();
      if ((j.chats||[]).length){ openChat(j.chats[0].id); } else { newChat(); }
    }
  }catch(e){}
}

async function ensureChat(){
  if (currentChatId) return currentChatId;
  const r = await fetch('/api/chats', {method:'POST'}); const c = await r.json();
  currentChatId = c.id; localStorage.setItem('ava.chat', c.id); loadChats();
  return currentChatId;
}

async function initChats(){
  const last = localStorage.getItem('ava.chat');
  try{
    const r = await fetch('/api/chats'); const j = await r.json();
    renderChatList(j.chats||[]);
    const ids = (j.chats||[]).map(c=>c.id);
    if (last && ids.includes(last)) { openChat(last); }
    else if (ids.length) { openChat(ids[0]); }
    else { add('sys','Hold the mic to talk, type a message, or attach a document or image.'); }
  }catch(e){
    add('sys','Hold the mic to talk, type a message, or attach a document or image.');
  }
}

function pickMime(){
  const opts = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac',''];
  for (const o of opts){ if (o==='' || (window.MediaRecorder && MediaRecorder.isTypeSupported(o))) return o; }
  return '';
}

async function ensureStream(){
  if (stream) return stream;
  stream = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
  return stream;
}

async function startRec(){
  if (busy || recording) return;
  try { await ensureStream(); }
  catch(e){ hint.textContent = 'Mic blocked — allow microphone access.'; return; }
  const mime = pickMime();
  chunks = [];
  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = onStop;
  mediaRecorder.start();
  recording = true;
  btn.classList.add('rec');
  statusEl.textContent = 'listening… release to send'; hint.textContent='';
}

function stopRec(){
  if (!recording || !mediaRecorder) return;
  recording = false;
  try { mediaRecorder.stop(); } catch(e){}
  btn.classList.remove('rec');
}

async function onStop(){
  const blob = new Blob(chunks, { type: (chunks[0] && chunks[0].type) || 'audio/webm' });
  if (!blob.size){ statusEl.textContent='hold the mic to talk'; return; }
  const atts = pending.slice();
  busy = true; btn.classList.add('busy'); statusEl.textContent='thinking…';
  const cid = await ensureChat();
  const fd = new FormData();
  fd.append('audio', blob, 'clip');
  fd.append('history', JSON.stringify(history));
  fd.append('attachments', JSON.stringify(atts.map(a=>a.id)));
  fd.append('chat_id', cid);
  try{
    const r = await fetch('/api/talk', { method:'POST', body: fd });
    const j = await r.json();
    if (j.error){ addSys(j.error,'alert'); }
    else if (j.accepted === false){ addSys('voice not recognized'
        + (j.sim!=null?` (match ${j.sim} < ${j.threshold})`:''), 'lock'); }
    else {
      if (j.text || atts.length){ addMe(j.text||'', atts); if(j.text) history.push({role:'user', content:j.text}); pending=[]; renderChips(); }
      if (j.note && !j.text){ add('sys', j.note); }
      if (j.reply){ add('ava', j.reply); history.push({role:'assistant', content:j.reply}); }
      history = history.slice(-12);
      if (j.sim!=null) hint.textContent = 'voice match: ' + j.sim;
      if (j.audio){ playWav(j.audio); }
    }
  }catch(e){ addSys('network error: '+e.message,'alert'); }
  busy = false; btn.classList.remove('busy');
  statusEl.textContent='hold the mic to talk';
  loadChats();
}

async function sendText(){
  const t = textEl.value.trim();
  const atts = pending.slice();
  if ((!t && !atts.length) || busy) return;
  textEl.value = ''; autoGrow();
  const meBubble = addMe(t, atts); if(t) history.push({role:'user', content:t}); history = history.slice(-12);
  pending=[]; renderChips();
  busy = true; statusEl.textContent='thinking\u2026';
  const cid = await ensureChat();
  await submit(t, atts, cid, meBubble);
  busy = false; statusEl.textContent='hold the mic to talk';
  loadChats();
}

// Routing shared by first-send and retry: every message goes through Ava with
// her live chain-of-thought. On failure the user's bubble becomes tap-to-retry.
async function submit(t, atts, cid, meBubble){
  try{
    await runAvaTurn(t, atts, cid, meBubble);
  }catch(e){ addSys('network error: '+e.message,'alert'); markRetry(meBubble, t, atts); }
}

function playWav(b64){
  try{ const a = new Audio('data:audio/wav;base64,'+b64); a.play().catch(()=>{}); }catch(e){}
}

initChats();
</script>
