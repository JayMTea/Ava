<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="__BRAND_CHROME__">
<!-- SVG first for hi-dpi; the .ico is both the fallback and the branded
     path, since /favicon.svg 404s when a brand icon is set. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<title>__BRAND__ &middot; Sign in</title>
<style>
 __BRAND_CSS__
 *{box-sizing:border-box} html,body{height:100%}
 body{margin:0;font:16px/1.5 var(--font-ui);
   background:var(--bg);color:var(--txt);
   display:flex;align-items:center;justify-content:center;padding:24px}
 .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
   border-radius:20px;padding:32px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
 .logo{width:44px;height:44px;border-radius:12px;margin:0 auto 16px;display:flex;align-items:center;
   justify-content:center;background:var(--accent);color:#fff}
 .logo svg{width:24px;height:24px}
 h1{font-weight:600;font-size:26px;text-align:center;margin:0 0 6px;
   letter-spacing:-.02em}
 p.sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:14px}
 input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--inputline);
   background:var(--input);color:var(--txt);font-size:16px;margin-bottom:12px;font-family:inherit}
 input::placeholder{color:var(--muted)}
 input:focus{outline:none;border-color:#5c5951}
 button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;
   font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
 button:hover{background:var(--accent-hover)} button:active{transform:translateY(1px)}
 .msg{color:#e58a6f;font-size:13px;text-align:center;min-height:18px;margin-bottom:8px}
</style></head><body>
 <form class="card" method="post" action="/login">
  <div class="logo" aria-hidden="true">
   __BRAND_MARK__
  </div>
  <h1>__BRAND__</h1>
  <p class="sub">Enter your password to continue</p>
  <div class="msg"><!--MSG--></div>
  <!-- A password manager keys a saved credential on an account, and will not
       reliably offer to save one — or fill it with Face ID — from a form that
       has only a password in it. This is that account field: constant, since
       there is exactly one owner, and hidden since there is nothing to choose.
       `login_post` reads `password` and ignores this. -->
  <input type="text" name="username" value="owner" autocomplete="username"
    hidden readonly tabindex="-1" aria-hidden="true">
  <input type="password" name="password" placeholder="Password" autofocus
    autocapitalize="off" autocomplete="current-password">
  <button type="submit">Sign in</button>
 </form>
</body></html>
