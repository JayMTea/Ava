<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262624">
<title>Ava &middot; Sign in</title>
<style>
 :root{--bg:#262624;--panel:#1f1e1d;--line:#3b3a36;--muted:#9a968c;--txt:#f4f3ee;
   --accent:#007acc;--accent-hover:#0068ad;--input:#30302e;--inputline:#46443f;
   --serif:ui-serif,Georgia,"Times New Roman",serif}
 *{box-sizing:border-box} html,body{height:100%}
 body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
   background:var(--bg);color:var(--txt);
   display:flex;align-items:center;justify-content:center;padding:24px}
 .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
   border-radius:20px;padding:32px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
 .logo{width:44px;height:44px;border-radius:12px;margin:0 auto 16px;display:flex;align-items:center;
   justify-content:center;background:var(--accent);color:#fff}
 .logo svg{width:24px;height:24px}
 h1{font-family:var(--serif);font-weight:500;font-size:26px;text-align:center;margin:0 0 6px;
   letter-spacing:.2px}
 p.sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:14px}
 input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--inputline);
   background:var(--input);color:var(--txt);font-size:16px;margin-bottom:12px;font-family:inherit}
 input::placeholder{color:var(--muted)}
 input:focus{outline:none;border-color:#5c5951}
 button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;
   font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
 button:hover{background:var(--accent-hover)} button:active{transform:translateY(1px)}
 .msg{color:#e58a6f;font-size:13px;text-align:center;min-height:18px;margin-bottom:8px}
</style></head><body>
 <form class="card" method="post" action="/login" autocomplete="off">
  <div class="logo" aria-hidden="true">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
  </div>
  <h1>Ava</h1>
  <p class="sub">Enter your password to continue</p>
  <div class="msg"><!--MSG--></div>
  <input type="password" name="password" placeholder="Password" autofocus
    autocapitalize="off" autocomplete="current-password">
  <button type="submit">Sign in</button>
 </form>
</body></html>
