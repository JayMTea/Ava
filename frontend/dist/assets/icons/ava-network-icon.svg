<svg viewBox="0 0 140 152" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AVA neural network icon">
  <!-- secondary connections (fully-connected cross edges) -->
  <g stroke="#A9BFD2" stroke-width="3.5" fill="none">
    <line x1="37" y1="122" x2="90.4" y2="90"/>
    <line x1="103" y1="122" x2="49.6" y2="90"/>
  </g>
  <!-- primary edges tracing the A -->
  <g stroke="#1A1D21" stroke-width="6.5" fill="none" stroke-linecap="round">
    <line x1="70" y1="30" x2="37" y2="122"/>
    <line x1="70" y1="30" x2="103" y2="122"/>
    <line x1="49.6" y1="90" x2="90.4" y2="90"/>
  </g>
  <!-- nodes -->
  <circle cx="70" cy="30" r="12" fill="#5B84A8"/>
  <circle cx="49.6" cy="90" r="8.5" fill="#1A1D21"/>
  <circle cx="90.4" cy="90" r="8.5" fill="#1A1D21"/>
  <circle cx="37" cy="122" r="10" fill="#1A1D21"/>
  <circle cx="103" cy="122" r="10" fill="#1A1D21"/>
</svg>
