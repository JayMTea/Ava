<!-- THE VECTOR IS THE ONLY DECLARED TAB ICON. favicon.svg and the docs site's
     favicon (docs-site/docs/assets/favicon.svg) are the same bytes, so the app
     tab and the docs tab must be the same picture — and they were not. The .ico
     used to be declared here too, with `sizes="16x16 32x32 48x48"`, and an
     explicit exact-size match outranks a sizeless SVG in Chrome: the app tab
     rendered the .ico while jaymtea.github.io/Ava/, which links the SVG alone,
     rendered the vector. Same mark, two rasterisers — the .ico's 16/32px frames
     are a Lanczos downscale of pwa-512.png, which softens the strokes and pulls
     the legs in, so side by side in one tab strip they read as two logos. That
     is the exact failure tools/sync_icons.py exists to prevent, arriving through
     the one door it does not watch: it proves the FILES agree (they do, to 0.12
     mean error at 512), not that the browser picks the same one.
     Declaring only the SVG is what makes the two tabs match.

     /favicon.ico is still built, still tracked, still served by
     ava_bridge/pages.py:favicon(). Dropping the <link> does not delete the
     fallback — a browser with no usable declared icon falls back to /favicon.ico
     at the root by convention, which is also where Windows looks for a pinned
     shortcut. It only stops the raster from outranking the vector.

     The .ico was also described here as "the branded path", because
     /favicon.svg once 404'd when a brand icon was set. It does not any more —
     pages.py:favicon_svg() always serves Ava's mark, by rule. That reason was
     already gone before this link was. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<!-- The boot script below replaces this from the cached brand. This is
     what a profile with nothing cached sees for one frame. -->
<title>Ava</title>
<script>
  // Stamp the theme AND the brand before first paint, so there is neither a
  // dark→light flash nor a blue→brand one. Mirrors src/lib/theme.ts (saved →
  // OS → dark) and src/lib/brand.ts applyBrand() respectively.
  //
  // This runs from the PRECACHED shell, which is why the mechanism lives here
  // rather than in a stylesheet the server renders: the service worker serves
  // index.html offline, so a brand that needed a request would be missing in
  // exactly the case a PWA exists for. The cache is written by the last
  // successful fetch; a brand-new profile paints Ava's default for one frame
  // and revalidate() corrects it, which is the same deal the theme stamp has
  // always made.
  //
  // TWO try blocks, not one: a corrupt brand cache must not cost the theme
  // stamp. Sharing a block would have made a single bad JSON value produce a
  // light-mode user staring at a dark app.
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem('ava.theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      d.setAttribute('data-theme', t);
    } catch (e) { d.setAttribute('data-theme', 'dark'); }
    try {
      var b = JSON.parse(localStorage.getItem('ava.brand') || 'null');
      if (b && b.accent) {
        d.style.setProperty('--brand-accent', b.accent);
        d.style.setProperty('--brand-accent-light', b.accent_light || b.accent);
        d.setAttribute('data-brand', 'on');
      }
      if (b && b.chrome) {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', b.chrome);
      }
      if (b && b.name) document.title = b.name;
    } catch (e) { /* no brand cached, or unreadable: Ava's own look, which is correct */ }
  })();
</script>
