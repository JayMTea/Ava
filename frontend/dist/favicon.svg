<!-- Ava's browser tab icon: the SAME mark as the PWA icon, not a second
     drawing of it. Geometry, gradient and stroke weights are the source
     master's (brand/pwa-icon-transparent.svg), the file assets/icons/pwa-192.png
     and pwa-512.png are rendered from — so the tab, the home screen and the
     installed app icon are one logo at three sizes.

     Regenerate BOTH favicons whenever that master changes. They are separate
     files from the PWA icons and nothing rebuilds them automatically, so
     updating pwa-192/512 alone silently leaves the tab on the previous logo —
     which has now happened twice.

     It carried a #007ACC rounded tile until the PWA icons dropped theirs. The
     tile existed for contrast: on a dark tab strip the mark has no background
     of its own, and at 16px a thin glyph is the weakest thing in the strip.
     The current master answers that with weight rather than a backdrop — 9px
     primary strokes against the old 6.5 — and it was checked at 16px composited
     over both a dark strip and white before shipping.

     If it ever does prove too faint, the fix is heavier strokes or darker nodes
     in the master, not a tile here: re-adding a tile to this file without
     re-adding it to pwa-192/512 is what put the two out of sync before.

     apple-touch-icon.png and pwa-maskable-512.png keep their tiles on purpose
     and are not drift: iOS composites transparency onto black, and a maskable
     icon is full-bleed by contract with the platform cropping into it.

     Served by ava_bridge/pages.py:favicon_svg() — always Ava's, there is no
     branded branch. Kept out of the service-worker precache in vite.config.ts.

     No <script>, no external refs: Ava sets no CSP, so a first-party SVG must
     stay inert by construction. This one is authored here, never uploaded;
     docs/BRANDING.md refuses SVG for owner-supplied images. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ava">
  <defs>
    <linearGradient id="avaBlue" gradientUnits="userSpaceOnUse" x1="0" y1="139" x2="0" y2="11">
      <stop offset="0" stop-color="#0064E0"/>
      <stop offset="1" stop-color="#0091FF"/>
    </linearGradient>
  </defs>
  <g transform="translate(256,256) scale(3.75) translate(-70,-75)">
    <g stroke="#7FC4FF" stroke-width="5" fill="none" stroke-linecap="round">
      <line x1="27" y1="129" x2="97.2" y2="90"/>
      <line x1="113" y1="129" x2="42.8" y2="90"/>
    </g>
    <g stroke="url(#avaBlue)" stroke-width="9" fill="none" stroke-linecap="round">
      <line x1="70" y1="23" x2="27" y2="129"/>
      <line x1="70" y1="23" x2="113" y2="129"/>
      <line x1="42.8" y1="90" x2="97.2" y2="90"/>
    </g>
    <circle cx="70" cy="23" r="13.5" fill="url(#avaBlue)"/>
    <circle cx="42.8" cy="90" r="10" fill="url(#avaBlue)"/>
    <circle cx="97.2" cy="90" r="10" fill="url(#avaBlue)"/>
    <circle cx="27" cy="129" r="11.5" fill="url(#avaBlue)"/>
    <circle cx="113" cy="129" r="11.5" fill="url(#avaBlue)"/>
  </g>
</svg>
