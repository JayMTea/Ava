<!-- Ava's browser tab icon. The neural-network A from
     frontend/public/assets/icons/ava-network-icon-blue.svg, as drawn: its own
     palette, its own stroke weights, transparent, cross-links intact. Only the
     framing differs, the source viewBox carries ~20% dead margin that a 16px
     tab cannot afford.

     Served by ava_bridge/pages.py:favicon_svg(), which 404s when a brand icon
     is set so a branded install falls back to the .ico. Kept out of the
     service-worker precache in vite.config.ts for the same reason.

     No <script>, no external refs: Ava sets no CSP, so a first-party SVG must
     stay inert by construction. This one is authored here, never uploaded;
     docs/BRANDING.md refuses SVG for owner-supplied images. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ava">
  <g transform="translate(86.05,30.72) scale(3.95228) translate(-27,-18)">
    <g stroke="#A9BFD2" stroke-width="3.5" fill="none">
      <line x1="37" y1="122" x2="90.4" y2="90"/>
      <line x1="103" y1="122" x2="49.6" y2="90"/>
    </g>
    <g stroke="#5B84A8" stroke-width="6.5" fill="none" stroke-linecap="round">
      <line x1="70" y1="30" x2="37" y2="122"/>
      <line x1="70" y1="30" x2="103" y2="122"/>
      <line x1="49.6" y1="90" x2="90.4" y2="90"/>
    </g>
    <circle cx="70" cy="30" r="12" fill="#5B84A8"/>
    <circle cx="49.6" cy="90" r="8.5" fill="#5B84A8"/>
    <circle cx="90.4" cy="90" r="8.5" fill="#5B84A8"/>
    <circle cx="37" cy="122" r="10" fill="#5B84A8"/>
    <circle cx="103" cy="122" r="10" fill="#5B84A8"/>
  </g>
</svg>
