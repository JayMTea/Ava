# EDITABLE INSTALL ONLY: source assets are resolved from the checkout.
# Non-editable wheels require separate package-data support.

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ava"
description = "Your private AI: self-hosted, on your hardware, wired to your world."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "The Ava Authors" },
]
maintainers = [
    { name = "The Ava Authors" },
]
urls = { Homepage = "https://github.com/JayMTea/Ava", Documentation = "https://jaymtea.github.io/Ava/", Source = "https://github.com/JayMTea/Ava", Issues = "https://github.com/JayMTea/Ava/issues" }
# 3.12 is what CI runs, what deploy/Dockerfile ships, and what ruff targets.
requires-python = ">=3.12"
dynamic = ["version", "dependencies"]

[project.scripts]
# app.cli.main() already returns int, so no code change was needed for this.
ava = "app.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }
# Read from config/dependencies/runtime.txt rather than restated here. Two dependency lists for
# one project is the same failure mode as the two ruff pins CI used to carry.
dependencies = { file = ["config/dependencies/runtime.txt"] }

# Explicit packages keep instance data out of the editable installation.
[tool.setuptools]
packages = [
    "app", "app.backend", "ava_agent", "ava_agent.alloc", "ava_agent.alloc.drivers",
    "ava_agent.adapters", "app.backend.hub", "app.backend.voice",
]
py-modules = []

[tool.setuptools.package-dir]
ava_agent = "agent-platform/integrations/ava/ava_agent"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests/unit"]
norecursedirs = ["integration", "app/frontend", "overlay", "demo", ".venv", "agent-platform"]
